const VIEW = localizeJA(await (await fetch(ON_GROWTH
  ? '/decision-network-growth-data.json'
  : '/decision-network-data.json')).json());
/** the layout is fixed, so the same run always draws the same picture */
const LAYOUT_SEED = 20260827;
/**
 * The largest picture this page will draw.
 *
 * The component was built for a synthesized run of at most forty-six steps. One view here is one
 * seed and one method of the accepted run: eleven decisions, seven agents at every one of them,
 * and the rule checks and state changes between them. The bake refuses to write a view larger
 * than this, and the frame cost of the largest one is measured by the gate.
 */
const MAXN = 200;
/** which seed and which method the next build shows. Next run and Method step them and wrap. */
let seedAt = 0, methodAt = 0, stepAxis = 'seed', firstBuild = true;
{
  // The address may also open the page on one run of the campaign it loaded, which is how a link
  // from the impact page arrives. A seed or a method the loaded campaign does not hold is ignored,
  // and the page opens on that campaign's own first run.
  const asked = new URLSearchParams(location.search);
  const onSeed = VIEW.seeds.indexOf(Number(asked.get('seed')));
  const onMethod = VIEW.method_order.indexOf(asked.get('method'));
  if (onSeed >= 0) seedAt = onSeed;
  if (onMethod >= 0) methodAt = onMethod;
}
/** which node the picture last painted its isolated path from */
let paintedSel = -1;

/**
 * One tint per kind of node, so a viewer can tell what a gem is without touching it.
 *
 * The auditor set the eight kinds and their colours, and the bake carries them. Every tint sits
 * in the palette the component already uses: one cool, low ground on black. The admitted action
 * keeps the component's own accent blue and the rejected proposal keeps its own failure red, and
 * the two dim states, selection and focus are untouched and always win, so a tint can never hide
 * a refusal or make an unreached decision look reached.
 */
const TINT = {};
for (const one of VIEW.classes){
  TINT[one.id] = {live:new THREE.Color(one.live), done:new THREE.Color(one.done)};
}
const tintFor = (cls) => TINT[cls] || {live:C_LIVE, done:C_DONE};
/** the same eight kinds by name, for the glyph and the colour the flat readout draws */
const GLYPH = {};
for (const one of VIEW.classes) GLYPH[one.id] = one;
/** the two kinds of edge: what one agent passed to the next, and what the run carried forward */
const EDGE_TINT = {};
for (const one of VIEW.edge_kinds) EDGE_TINT[one.id] = new THREE.Color(one.color);

/** the earthquake's own clock at one hour of the run, counted from the recorded minute */
function clockAt(hours){
  const mins = VIEW.incident.startMinute + Math.round(hours * 60);
  const day = VIEW.incident.startDay + Math.floor(mins/1440);
  const held = ((mins % 1440) + 1440) % 1440;
  const two = n => ('0'+n).slice(-2);
  return day + ' ' + VIEW.incident.month + '  ' + two(Math.floor(held/60)) + ':' + two(held%60);

function mulberry32(sd){
  let a = sd>>>0;
  return function(){
    a = (a + 0x6D2B79F5)|0;
    let t = Math.imul(a ^ (a>>>15), 1|a);
    t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}

let tree = null, seed = 20260826;

/**
 * Where each kind of node stands in one decision.
 *
 * The run reads left to right, one decision at a time. Inside a decision the seven agents stand
 * in their own three lanes — scout one above reviewer one, and so on — and the rule checks, the
 * proposal, the admission and the modeled change stand on the spine down the middle. Because
 * every decision draws the same seven agents in the same three lanes, a viewer can see that the
 * team never grows.
 */
const LANE = [0.62, 2.55, 4.35];
const LANE_RAD = 3.9;
const GEOM = {
  incident:   {rad:0.00, ang:0},
  scout:      {rad:LANE_RAD, lane:true},
  gate:       {rad:1.70, ang:3.6},
  reviewer:   {rad:LANE_RAD, lane:true},
  handoff:    {rad:1.00, ang:0},
  evidence:   {rad:1.00, ang:0},
  proposal:   {rad:0.00, ang:0},
  correction: {rad:1.80, ang:2.00},
  admitted:   {rad:0.00, ang:0},
  rejected:   {rad:0.00, ang:0},
  change:     {rad:0.66, ang:0}
};
/** how far one step of a decision moves to the right, in the run's own units */
const STAGE_STEP = 0.055;

function buildTree(_sd){
  // The seed is inert. The accepted run does not change, so neither does the picture: one fixed
  // seed lays the branches out, and the two run controls step through the campaign's own seeds
  // and its own four methods instead.
  const r = mulberry32(LAYOUT_SEED);
  if (firstBuild) firstBuild = false;
  else if (stepAxis === 'method') methodAt = (methodAt + 1) % VIEW.method_order.length;
  else seedAt = (seedAt + 1) % VIEW.seeds.length;
  stepAxis = 'seed';
  const wantSeed = VIEW.seeds[seedAt], wantMethod = VIEW.method_order[methodAt];
  const held = VIEW.views.find(one => one.seed === wantSeed && one.method_id === wantMethod);
  const nodes = [], edges = [];
  // one run unit per decision, so eleven decisions read evenly across the picture and the line
  // under it. Every mark on that line still carries the hour the record gives it.
  const total = held.decisions + 1;
  // how far apart two decisions stand, and how far the whole run is slid so that it sits in the
  // middle of the frame the component's own camera looks at
  const step = 0.655;
  // the whole run is slid right of the column the key stands in, and no further than the frame
  const GUTTER = 1.22;
  const shift = 2.93 + GUTTER
    - (step + step*held.decisions + (held.stages-1)*STAGE_STEP)/2;
  held.nodes.forEach((row, i) => {
    const stage = GEOM[row.cls] || {rad:0, ang:0};
    // Where an agent a decision called in stands. The three standing lanes keep their own angles,
    // so the team never looks like it grew; an agent called into a lane stands in that lane and
    // closer to the spine, at 0.62 of the standing distance, where it reads as extra.
    const inLane = stage.lane ? row.slot % LANE.length : 0;
    const inward = (stage.lane && row.slot >= LANE.length) ? 0.62 : 1;
    const when = row.decision < 0 ? 0.15 : row.decision + 1;
    const at = row.decision < 0 ? 0
      : Math.max(0, when - 1 + (row.stage / held.stages));
    const nd = {
      id: i, tier: row.decision < 0 ? shift
        : (row.decision + 1) * step + row.stage * STAGE_STEP + shift,
      parent: -1, kids: [], in: [], out: [],
      cls: row.cls, decision: row.decision, stage: row.stage, agent: row.agent,
      ang: (stage.lane ? LANE[inLane] : stage.ang) + (r()-0.5)*0.05,
      rad: stage.rad * inward + r()*0.06,
      // the same phrase written from the longest form to the shortest, so what stands beside the
      // gem is a whole sentence at a width that never crosses another one
      labels: row.labels, action: row.labels[0], readout: row.readout, chips: row.chips,
      // whether this agent was on the team when its decision began, or was called in during it
      added: row.added || null,
      admitted: row.admitted === undefined ? null : row.admitted,
      moment: row.decision < 0 ? null : held.moments[row.decision],
      incident: row.decision < 0,
      hours: row.hours, artifact: row.artifact,
      prune:false, reach:true,
      open: at, res: row.decision < 0 ? 0.15 : (at + 1/held.stages)
    };
    nodes.push(nd);
  });
  held.edges.forEach((row, e) => {
    const edge = [row.a, row.b];
    edge.kind = row.kind;
    edge.carry = row.kind === 'carry';
    edges.push(edge);
    nodes[row.b].in.push(e);
    nodes[row.a].out.push(e);
    // the arrow keys walk the information a decision was built from, so a node's parent is the
    // last thing that reached it
    if (nodes[row.b].parent < 0){ nodes[row.b].parent = row.a; nodes[row.a].kids.push(row.b); }
  });
  // the replay opens on the earthquake itself, not part way through the first decision
  p = 0;
  const built = {
    nodes, edges, total, view: held, seed: held.seed, method: held.method_id,
    methodLabel: held.method_label, decisions: held.decisions, counts: held.counts,
    moments: held.moments, stages: held.stages
  };
  // one handle, so a gate can read what is drawn and stand on one node without a mouse
  try {
    built.selected = () => ({id: sel, state: states[sel], node: tree.nodes[sel]});
    built.select = (id) => { sel = id; userPicked = true; return states[id]; };
    built.clear = () => { userPicked = false; sel = 0; };
    built.seek = (u) => { p = u; };
    built.readout = () => (built.said || []).slice();
    built.labelAt = (id) => roomFor(id);
    built.labelWidth = VIEW_WORDS.labelWidth;
    built.marks = () => (built.drawn || []).slice();
    built.keyRows = () => (built.keyLines || []).slice();
    built.anchors = () => (built.anchorsDrawn || []).slice();
    built.tag = () => built.tagged || null;
    // the colour one gem is actually painted, so a gate can prove a waiting node still says
    // which kind of node it is
    // where every gem stands on the screen, and where the key stands, so a gate can prove the
    // network never runs behind the key
    built.screen = () => scr.map((one, id) => ({id: id, x: one.x, y: one.y + TOP, vis: one.vis}));
    built.keyBox = () => keyBox;
    built.limitBox = () => limitBox;
    built.ink = (id) => {
      const held = new THREE.Color();
      nodeMesh.getColorAt(id, held);
      return {r: held.r, g: held.g, b: held.b, state: states[id], cls: tree.nodes[id].cls};
    };
    // what the frame measures, so a gate can prove nothing the page draws overlaps anything else
    built.metrics = () => ({W: W, H: H, TOP: TOP, BOT: BOT,
      rows: ROWS.at(ROWS.reserve()).map((one) => H + one),
      band: H - BOT - ROWS.above(), bandRows: ROWS.reserve(),
      timelineBaseline: H - BOT - 8 - ROWS.above(),
      reading: VIEW_WORDS.reading});
    built.classes = VIEW.classes.slice();
    built.path = () => {
      const lit = pathFrom(sel);
      return lit.nodes ? {nodes:[...lit.nodes], edges:[...lit.edges]} : null;
    };
    built.seeds = VIEW.seeds.slice();
    built.methods = VIEW.method_order.slice();
    window.__DECISIONNETWORK = built;
  } catch(_){}
  return built;
}

/**
 * The path through the network that one node stands on.
 *
 * Everything that reached this node, and everything this node reached: the information its
 * decision was built from, upstream, and the action and state its decision carried on, downstream.
 * Nothing is hidden. The rest of the picture dims and stays where it is, so a viewer keeps their
 * bearings while one path is isolated.
 */
function pathFrom(at){
  if (!userPicked || !tree || at < 0 || at >= tree.nodes.length) return {nodes:null, edges:null};
  const heldNodes = new Set([at]), heldEdges = new Set();
  const walk = (from, way, only) => {
    const queue = [from];
    const seen = new Set([from]);
    while (queue.length){
      const id = queue.pop();
      for (const e of tree.nodes[id][way]){
        if (only && tree.edges[e].kind !== only) continue;
        const next = tree.edges[e][way === 'in' ? 0 : 1];
        heldEdges.add(e);
        heldNodes.add(next);
        if (!seen.has(next)){ seen.add(next); queue.push(next); }
      }
    }
  };
  // first the work of this one decision, which is what was passed from hand to hand to reach
  // this node and what this node was passed on to
  walk(at, 'in', 'information');
  walk(at, 'out', 'information');
  // then the state either side of it, which is the one thread that runs between decisions
  for (const id of [...heldNodes]){
    walk(id, 'in', 'carry');
    walk(id, 'out', 'carry');
  }
  return {nodes:heldNodes, edges:heldEdges};
}

function placeTree(tr){
  for (const nd of tr.nodes){
    const rad = (nd.rad||0) * D.spread;
    if (!nd.pos) nd.pos = new THREE.Vector3();
    nd.pos.set(nd.tier*1.5 - 4.4, 1.95 + Math.sin(nd.ang)*rad*0.52, Math.cos(nd.ang)*rad*1.02);
  }
}

/* ---------------------------------------------------------------- 3d scene */

let nodeMesh=null, edgeLine=null, halo=null, flowPts=null, gridLines=null, floor=null, ring=null;
let haloGeo=null, edgeGeo=null, flowGeo=null;
let gl_ok = false;
const EDGE_SEG = 8, MAXFLOW = 420;
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(),
      tmpS = new THREE.Vector3(), tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(),
      tmpAx = new THREE.Vector3(), tmpProj = new THREE.Vector3();
const target = new THREE.Vector3(0, 1.95, 0);

try {
  renderer = new THREE.WebGLRenderer({canvas:glc, antialias:true, alpha:false, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));

const haloMat = gl_ok ? new THREE.ShaderMaterial({
  uniforms:{ uPx:{value:400}, uGlow:{value:1} },
  vertexShader:[
    'attribute float aSize;','attribute float aAlpha;','attribute vec3 aColor;',
    'varying vec3 vC; varying float vA; uniform float uPx;',
    'void main(){ vC = aColor; vA = aAlpha;',
    '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
    '  gl_PointSize = aSize * uPx / max(0.001, -mv.z);',
    '  gl_Position = projectionMatrix * mv; }'
  ].join('\n'),
  fragmentShader:[
    'varying vec3 vC; varying float vA; uniform float uGlow;',
    'void main(){ vec2 d = gl_PointCoord - 0.5; float r = length(d) * 2.0;',
    '  if (r > 1.0) discard;',
    '  float a = pow(1.0 - r, 2.4);',
    '  gl_FragColor = vec4(vC * a * vA * uGlow, 1.0); }'
  ].join('\n'),
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
}) : null;

function ctrlPoint(a, b, out){
  out.copy(a).add(b).multiplyScalar(0.5);
  out.y += 0.10;
  out.z *= 1.16;
  return out;
}
function bez(a, c, b, t, out){
  const it = 1-t, w0 = it*it, w1 = 2*it*t, w2 = t*t;
  out.set(a.x*w0 + c.x*w1 + b.x*w2, a.y*w0 + c.y*w1 + b.y*w2, a.z*w0 + c.z*w1 + b.z*w2);
  return out;
}

function buildScene(){

    nodeMesh.setMatrixAt(i, tmpM);
    nodeMesh.setColorAt(i, C_PEND);
  }
  scene.add(nodeMesh);

  edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(E*EDGE_SEG*2*3),3));
  edgeGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(E*EDGE_SEG*2*3),3));
  edgeLine = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    vertexColors:true, transparent:true, opacity:D.edge, blending:THREE.AdditiveBlending, depthWrite:false}));
  edgeLine.frustumCulled = false;
  scene.add(edgeLine);

  haloGeo = new THREE.BufferGeometry();

  flowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAXFLOW*3),3));

  ring = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.008, 5, 44),

function buildFloor(){
  if (floor){ scene.remove(floor); floor.geometry.dispose(); floor.material.dispose(); floor = null; }
  floor = new THREE.Mesh(new THREE.PlaneGeometry(30,22),
    new THREE.MeshStandardMaterial({color:0x0a0a0d, roughness:1, metalness:0}));
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -0.02;

function rebuildGrid(){
  if (!gl_ok) return;
  if (gridLines){ scene.remove(gridLines); gridLines.geometry.dispose(); gridLines.material.dispose(); gridLines = null; }
  const step = 1.15 / Math.max(0.4, D.grid);
  const hx = 7.2, hz = 5.4, arm = step*0.16;
  const pts = [];
  for (let x=-hx; x<=hx+1e-6; x+=step) pts.push(x,0,-hz, x,0,hz);
  for (let z=-hz; z<=hz+1e-6; z+=step) pts.push(-hx,0,z, hx,0,z);
  for (let x=-hx; x<=hx+1e-6; x+=step)
    for (let z=-hz; z<=hz+1e-6; z+=step)
      pts.push(x-arm,0.004,z, x+arm,0.004,z, x,0.004,z-arm, x,0.004,z+arm);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  gridLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color:0x434343, transparent:true, opacity:0.26, depthWrite:false}));

function buildLights(){
  if (!key){
    key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024,1024);
    const sc = key.shadow.camera;
    sc.left=-8; sc.right=8; sc.top=6; sc.bottom=-6; sc.near=0.5; sc.far=34;
    sc.updateProjectionMatrix();
    scene.add(key); scene.add(key.target);
    rimL = new THREE.DirectionalLight(0x4183e7, 0.9);
    scene.add(rimL); scene.add(rimL.target);
    hemi = new THREE.HemisphereLight(0x2a3a5c, 0x0b0b0e, 0.36);
    scene.add(hemi);

const COOL = new THREE.Color(0xc6d4ea), WARM = new THREE.Color(0xffd7ac);
function applyLights(){
  if (!key) return;
  const d = 13;
  key.position.set(target.x + d*Math.sin(D.az)*Math.cos(D.el),
                   target.y + d*Math.sin(D.el),
                   target.z + d*Math.cos(D.az)*Math.cos(D.el));
  key.target.position.copy(target);
  key.intensity = D.ilev;
  key.shadow.radius = D.soft;
  key.color.copy(COOL).lerp(WARM, D.warm);
  rimL.position.set(target.x - d*Math.sin(D.az)*0.8, target.y + d*0.28, target.z - d*Math.cos(D.az)*0.8);
  rimL.target.position.copy(target);
  rimL.intensity = D.rim;
  hemi.intensity = D.amb;
}

function disposeScene(){
  if (!scene) return;
  [nodeMesh, edgeLine, halo, flowPts, ring].forEach(o=>{
    if (!o) return;
    scene.remove(o);
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material !== haloMat) o.material.dispose();
  });
  nodeMesh=null; edgeLine=null; halo=null; flowPts=null; ring=null;
  haloGeo=null; edgeGeo=null; flowGeo=null;
}

function refreshGeometry(){
  if (!gl_ok || !edgeGeo || !haloGeo) return;
  const pos = edgeGeo.getAttribute('position'), arr = pos.array;
  const cp = tmpV2;
  let k = 0;
  for (let e=0;e<tree.edges.length;e++){
    const a = tree.nodes[tree.edges[e][0]].pos, b = tree.nodes[tree.edges[e][1]].pos;
    ctrlPoint(a,b,cp);
    for (let s=0;s<EDGE_SEG;s++){
      bez(a,cp,b, s/EDGE_SEG, tmpV);      arr[k]=tmpV.x; arr[k+1]=tmpV.y; arr[k+2]=tmpV.z; k+=3;
      bez(a,cp,b,(s+1)/EDGE_SEG, tmpV);   arr[k]=tmpV.x; arr[k+1]=tmpV.y; arr[k+2]=tmpV.z; k+=3;
    }
  }
  pos.needsUpdate = true;
  const hp = haloGeo.getAttribute('position');
  for (let i=0;i<tree.nodes.length;i++){
    hp.array[i*3]   = tree.nodes[i].pos.x;
    hp.array[i*3+1] = tree.nodes[i].pos.y;
    hp.array[i*3+2] = tree.nodes[i].pos.z;
  }
  hp.needsUpdate = true;
}

/* --------------------------------------------------------------- run state */
let p = 2.6;
let playing = true;
let endHold = 0;
let sel = 0, hover = -1, userPicked = false;
let states = [];
let flow = [];

function resolveStates(){
  // Playback only: waiting, being shown, shown. A proposal the run did not admit still stands in
  // the network and the run carries on past it, exactly as the campaign did.
  const nd = tree.nodes;
  let changed = false;
  for (let i=0;i<nd.length;i++){
    const n = nd[i];
    let s;
    if (p < n.open) s = 'pending';
    else if (p < n.res) s = 'running';
    else s = 'done';
    if (states[i] !== s){ states[i] = s; changed = true; }
  }
  // a new selection isolates a new path, which is a repaint and nothing else
  if (paintedSel !== sel){ paintedSel = sel; changed = true; }
  return changed;
}

function edgeLive(e){
  const a = states[tree.edges[e][0]], b = states[tree.edges[e][1]];
  if (b === 'pruned') return 2;
  if (b === 'running' || b === 'done') return 1;
  if (a === 'done' && b === 'pending') return 0.5;
  return 0;
}

function paintStates(){
  if (!gl_ok || !nodeMesh || !edgeGeo) return;
  const dim = 0.18 + (1-D.dim)*0.9;
  // the isolated path, where a viewer has picked a node; everything else keeps its colour and
  // stands back, so nothing is hidden and a viewer keeps their bearings
  const lit = pathFrom(sel);
  const AWAY = 0.30;
  const PENDING = 0.78;
  for (let i=0;i<tree.nodes.length;i++){
    const s = states[i];
    const hue = tintFor(tree.nodes[i].cls);
    const near = (lit.nodes && !lit.nodes.has(i)) ? AWAY : 1;
    if (s === 'running') _pc.copy(hue.live).multiplyScalar(near);
    else if (s === 'done') _pc.copy(hue.done).multiplyScalar(near);
    else if (s === 'pruned') _pc.copy(C_BAD);
    else if (s === 'skipped') _pc.copy(C_SKIP).multiplyScalar(dim);
    // A decision the replay has not reached yet keeps its own kind's colour, held back. The
    // three playback states are told by brightness, never by taking a node's identity away.
    else _pc.copy(hue.done).multiplyScalar(PENDING * near);
    nodeMesh.setColorAt(i, _pc);
  }
  if (nodeMesh.instanceColor) nodeMesh.instanceColor.needsUpdate = true;

  const col = edgeGeo.getAttribute('color'), arr = col.array;
  for (let e=0;e<tree.edges.length;e++){
    const lv = edgeLive(e);
    // what one agent passed to the next runs thin and tapers along its own line; what the run
    // carried forward runs solid and brighter, end to end
    const carry = tree.edges[e].carry;
    const near = (lit.edges && !lit.edges.has(e)) ? AWAY : 1;
    if (lv === 2) _ec.setHex(0xb11020).multiplyScalar(0.9);
    else if (lv === 1) _ec.copy(EDGE_TINT[carry ? 'carry' : 'information']).multiplyScalar(near);
    else if (lv === 0.5) _ec.copy(EDGE_TINT[carry ? 'carry' : 'information'])
      .multiplyScalar(0.44 * near);
    else _ec.copy(EDGE_TINT[carry ? 'carry' : 'information']).multiplyScalar(0.28 * near);
    const base = e*EDGE_SEG*2*3;
    for (let v=0; v<EDGE_SEG*2; v++){
      const f = (lv >= 1 && !carry) ? (0.55 + 0.45*(v/(EDGE_SEG*2-1))) : 1;
      arr[base+v*3]   = _ec.r*f;
      arr[base+v*3+1] = _ec.g*f;
      arr[base+v*3+2] = _ec.b*f;
    }
  }
  col.needsUpdate = true;
  rebuildFlow();
}

function rebuildFlow(){
  if (!gl_ok || !flowGeo) return;
  flow.length = 0;
  const per = Math.max(1, Math.round(3*D.flow));
  for (let e=0;e<tree.edges.length;e++){
    if (edgeLive(e) !== 1) continue;
    for (let i=0;i<per;i++){
      if (flow.length >= MAXFLOW) break;
      flow.push({e:e, off:((i + 0.31*e) % per)/per});
    }
  }
  flowGeo.setDrawRange(0, flow.length);
}

/* --------------------------------------------------- synthesized live wire */
const HIST = 168;
const hist = new Float32Array(HIST);
let histN = 0, walkT = 0, walkA = 0, walkB = 0, sig = 900;

function signal(t, dt, active){
  // the wire is the record, not a synthesized number: how many nodes of this view the replay has
  // reached. The picture does not draw it — the key stands in that column instead — and it is
  // kept true so nothing invented is ever held in this page's own history.
  let held = 0;
  for (let i=0;i<tree.nodes.length;i++) if (states[i] !== 'pending') held++;
  sig = held;
  return sig;
}

/* ------------------------------------------------------------ hud plumbing */
let W=560, H=380, TOP=46, BOT=76, FW=0, FH=0, compact=false, dpr=1;
const scr = [];
let noiseTile = null;

function makeNoise(){
  const n = document.createElement('canvas');
  n.width = n.height = 128;
  const g = n.getContext('2d');
  if (!g) return null;
  const img = g.createImageData(128,128);
  for (let i=0;i<128*128;i++){
    const v = Math.random();
    const a = v > 0.86 ? Math.floor((v-0.86)*1500) : 0;
    img.data[i*4] = 210; img.data[i*4+1] = 214; img.data[i*4+2] = 224;
    img.data[i*4+3] = Math.min(90, a);
  }
  g.putImageData(img,0,0);
  return n;
}

function layout(){
  W = stage.clientWidth || 560; H = stage.clientHeight || 380;
  compact = (W < 440 || H < 320);
  stage.classList.toggle('compact', compact);
  TOP = compact ? 34 : 46;
  BOT = compact ? 52 : 76;
  FW = Math.max(1, W); FH = Math.max(60, H - TOP - BOT);
  glc.style.top = TOP + 'px';
  glc.style.height = FH + 'px';
  tp.style.left = (compact ? 10 : 16) + 'px';
  tp.style.bottom = (compact ? 8 : 10) + 'px';
  dpr = Math.min(2, window.devicePixelRatio||1);
  hud.width = Math.max(1, Math.round(W*dpr));
  hud.height = Math.max(1, Math.round(H*dpr));
  hud.style.width = W + 'px'; hud.style.height = H + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (gl_ok){
    renderer.setPixelRatio(dpr);
    renderer.setSize(FW, FH, false);
    camera.aspect = FW/Math.max(1,FH);
    camera.updateProjectionMatrix();
    if (haloMat) haloMat.uniforms.uPx.value = FH*0.5 / Math.tan(camera.fov*Math.PI/360);

/* ------------------------------------------------------------ hud painting */
const F = w => w + 'px "Helvetica Neue",Helvetica,"Hiragino Sans","Yu Gothic UI",Arial,sans-serif';
function track(s, x, y, sp, align){
  let total = 0;
  for (let i=0;i<s.length;i++) total += ctx.measureText(s[i]).width + sp;
  total -= sp;
  let cx = (align==='right') ? x-total : (align==='center') ? x-total/2 : x;
  for (let i=0;i<s.length;i++){ ctx.fillText(s[i], cx, y); cx += ctx.measureText(s[i]).width + sp; }
}
function label(s,x,y,align,col){
  ctx.font = F(11); ctx.fillStyle = col || INK3;
  track(String(s).toUpperCase(), x, y, 0.88, align || 'left');
}
function num(s,x,y,size,align,col){
  ctx.font = F(size); ctx.fillStyle = col || INK;
  ctx.textAlign = align || 'left'; ctx.fillText(String(s), x, y); ctx.textAlign = 'left';
}
function hair(x0,y0,x1,y1,col){
  ctx.strokeStyle = col || RULE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Math.round(x0)+0.5, Math.round(y0)+0.5);
  ctx.lineTo(Math.round(x1)+0.5, Math.round(y1)+0.5); ctx.stroke();
}
function cross(x,y,a,col){
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(Math.round(x)-a, Math.round(y)+0.5); ctx.lineTo(Math.round(x)+a, Math.round(y)+0.5);
  ctx.moveTo(Math.round(x)+0.5, Math.round(y)-a); ctx.lineTo(Math.round(x)+0.5, Math.round(y)+a);
  ctx.stroke();
}

function drawHud(t){
  ctx.clearRect(0,0,W,H);
  const padX = compact ? 10 : 16;

  // the band reaches up over the picture by one row for every row a line of the readout was
  // broken onto, so a long line is written on a second row instead of off the edge of the frame
  const band = H - BOT - ROWS.above();

  ctx.fillStyle = '#0b0b0e';
  ctx.fillRect(0,0,W,TOP);
  ctx.fillRect(0,band,W,H-band);
  hair(0, TOP, W, TOP, RULE);
  hair(0, band, W, band, RULE);

  // the head of the frame: what the picture is, and what every node in it stands on
  num(VIEW.title, padX, compact?16:22, compact?13:18, 'left', INK);
  if (!compact){
    ctx.font = F(11); ctx.fillStyle = INK3;
    ctx.fillText(VIEW.subtitle, padX, 38);
  }
  label(VIEW_WORDS.clockLabel, W-padX, compact?14:17, 'right', INK2);
  num(clockAt(hoursNow()), W-padX, compact?30:38, compact?18:28, 'right', playing?INK:INK2);

  // the reading down the left: which run is on screen, and what every colour in it means
  const cy = TOP + (compact?16:22);
  if (!compact){
    num(VIEW_WORDS.runLine(tree.seed, tree.methodLabel, tree.decisions), padX, cy, 13,
      'left', INK);
    drawKey(padX, cy + 24);
    drawLimitation(padX);
  }

  drawNodeMarks(t);
  drawTimeline(padX);

  if (!compact) drawReadout(padX, tree.nodes[sel] || tree.nodes[0]);

  drawGrain();
}

/** the hour of the earthquake the replay has reached, from the last decision it has opened */
function hoursNow(){
  let held = 0;
  for (let i=0;i<tree.nodes.length;i++){
    if (states[i] !== 'pending' && tree.nodes[i].hours > held) held = tree.nodes[i].hours;
  }
  return held;
}

/**
 * The key, at the edge of the frame, at all times.
 *
 * One line for each kind of node, in the auditor's own words and colours, with how many of that
 * kind stand in the view on screen; then one line for each kind of edge. A viewer never has to
 * remember what a colour meant, and a kind of node that is not in this view still says so with a
 * count of none, so the key never changes shape under a reader.
 */
function drawKey(padX, y){
  // An agent a decision called in stands under two lines of the key: the shape of the work it did,
  // and the ring that says it was called in. Neither line replaces the other, so such an agent is
  // counted under both. A campaign that called none in names no such kind and this stays at zero.
  let calledIn = 0;
  for (const one of tree.nodes) if (one.added) calledIn += 1;
  label(VIEW_WORDS.keyName, padX, y, 'left', INK2);
  let at = y + 18;
  const from = at;
  tree.keyLines = [];
  for (const one of VIEW.classes){
    if (one.id === 'incident') continue;
    const held = one.id === 'called_in' ? calledIn : (tree.counts[one.id] || 0);
    glyph(one.glyph, padX + 5, at - 4, 5, held ? one.live : one.done);
    label(one.key, padX + 18, at, 'left', held ? INK : INK3);
    num(held, padX + 200, at, 11, 'right', held ? INK2 : INK3);
    // one handle, so a gate can read every line the key stands on
    tree.keyLines.push({id: one.id, key: one.key, glyph: one.glyph, count: held, y: at});
    at += 20;
  }
  at += 6;
  for (const one of VIEW.edge_kinds){
    ctx.strokeStyle = one.color; ctx.lineWidth = one.id === 'carry' ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(padX, at - 4.5); ctx.lineTo(padX + 9, at - 4.5); ctx.stroke();
    ctx.lineWidth = 1;
    label(one.key, padX + 16, at, 'left', INK3);
    at += 20;
  }
  // the box the key stands in, so no phrase beside a node is ever written across it
  keyBox = {x0: padX - 4, y0: y - 12, x1: padX + 230, y1: at};
}
/** where the key stands, once it has been drawn */
let keyBox = null;

/**
 * One class glyph, drawn at a point, in that class's own colour.
 *
 * Colour never acts alone on this page. Every kind of node carries its own small shape as well,
 * over the gem in the picture and beside its line in the key, so a reader who cannot tell the
 * hues apart still reads the network, and so does a grayscale print of it.
 */
function glyph(kind, x, y, r, col){
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
  ctx.beginPath();
  if (kind === 'circle'){ ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke(); }
  else if (kind === 'ring'){
    ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r*0.42, 0, Math.PI*2); ctx.stroke();
  }
  else if (kind === 'dot'){ ctx.arc(x, y, r*0.82, 0, Math.PI*2); ctx.fill(); }
  // the ring the picture draws around an agent a decision called in, standing on its own where the
  // key names it, so the key and the picture never show a reader two different marks
  else if (kind === 'halo'){
    ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r*0.22, 0, Math.PI*2); ctx.fill();
  }
  else if (kind === 'square'){ ctx.strokeRect(x-r+0.5, y-r+0.5, r*2-1, r*2-1); }
  else if (kind === 'hexagon'){
    for (let i=0;i<6;i++){
      const a = Math.PI/6 + i*Math.PI/3;
      const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
  }
  else if (kind === 'diamond'){
    ctx.moveTo(x, y-r); ctx.lineTo(x+r, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r, y);
    ctx.closePath(); ctx.stroke();
  }
  else if (kind === 'triangle'){
    ctx.moveTo(x, y-r); ctx.lineTo(x+r, y+r*0.8); ctx.lineTo(x-r, y+r*0.8);
    ctx.closePath(); ctx.stroke();
  }
  else if (kind === 'cross'){
    ctx.moveTo(x-r, y-r); ctx.lineTo(x+r, y+r);
    ctx.moveTo(x+r, y-r); ctx.lineTo(x-r, y+r);
    ctx.stroke();
  }
  else if (kind === 'bar'){ ctx.fillRect(x-r, y-2, r*2, 4); }
  else if (kind === 'slashbar'){
    ctx.fillRect(x-r, y-2, r*2, 4);
    ctx.beginPath(); ctx.moveTo(x+r*0.7, y-r); ctx.lineTo(x-r*0.7, y+r); ctx.stroke();
  }
  else { ctx.moveTo(x-r, y); ctx.lineTo(x+r, y); ctx.moveTo(x, y-r); ctx.lineTo(x, y+r);
    ctx.stroke(); }
}

/**
 * The rows of the band under the picture: where they stand, and how a line is broken across them.
 *
 * Rows are counted up from the bottom of the frame. The band has four of them where every line
 * fits its own width, and it stands between the timeline row above and the frame's own edge
 * below, clear of both; the last two rows stop short of the controls beside them. A line too long
 * for its width is broken at a word onto a second row, and a third where it needs one, at the
 * same reading size and with every word kept. The band reserves a row for every row any node in
 * the view on screen can need, so the timeline and the limitation above it stand still while a
 * reader steps from node to node. Nothing the page reads is written outside this band.
 */
const ROWS = {
  /** the height of one row, and the number of rows a band with nothing broken across it has */
  pitch: 18,
  base: 4,
  /** where a band of this many rows stands, counted up from the bottom of the frame */
  at(rows){
    const out = [];
    for (let i = rows - 1; i >= 0; i--) out.push(-12 - i*this.pitch);
    return out;
  },
  /**
   * What one line of the readout says, at what size, and on which rows.
   *
   * Reading text is 18 pixels in a wide frame and 16 in a narrow one. A line that fits its width
   * is one row and is written exactly as its parts join. A line that does not fit is broken
   * between words into as many rows as it needs; no word is dropped and no row is ever cut.
   */
  plan(bits, room){
    const kept = bits.filter(Boolean);
    const read = VIEW_WORDS.reading;
    let size = read.large;
    if (!kept.length) return {rows: [], size: size, text: ''};
    const said = kept.join('  ');
    ctx.font = F(size);
    if (W < read.wideFrom && ctx.measureText(said).width > room){
      size = read.small;
      ctx.font = F(size);
    }
    if (ctx.measureText(said).width <= room) return {rows: [said], size: size, text: said};
    const rows = [];
    let held = '';
    for (const word of said.split(/\s+/)){
      if (!word) continue;
      const next = held ? held + ' ' + word : word;
      if (held && ctx.measureText(next).width > room){ rows.push(held); held = word; }
      else held = next;
    }
    if (held) rows.push(held);
    return {rows: rows, size: size, text: rows.join(' ')};
  },
  /** how many rows the band holds for the view on screen, which is the most any one node needs */
  reserve(){
    if (compact || !tree) return this.base;
    const padX = 16;
    const room = W - padX*2;
    const rail = (W - padX) - (tp.offsetLeft + tp.offsetWidth + 14);
    const key = W + '/' + Math.round(rail);
    if (tree.bandAt === key) return tree.bandRows;
    let most = this.base;
    for (const n of tree.nodes){
      if (n.incident) continue;
      // the waiting line and the verdict stand in the same row, so the band holds the longer
      const held = this.plan([n.moment.situation], room).rows.length
        + this.plan([n.action, n.readout[1]], room).rows.length
        + Math.max(this.plan([n.moment.verdict], rail).rows.length,
          this.plan([VIEW_WORDS.waiting], rail).rows.length)
        + this.plan([n.moment.change], rail).rows.length;
      if (held > most) most = held;
    }
    tree.bandAt = key;
    tree.bandRows = most;
    return most;
  },
  /** how far the band reaches above the edge the frame gives it, to hold the rows it reserved */
  above(){ return (this.reserve() - this.base) * this.pitch; }
};

/** the limitation, in the words the design fixes, standing under the key at all times */
function drawLimitation(padX){
  // the band below reserves a row for every row it draws, and everything above it moves with it
  const above = ROWS.above();
  ctx.font = F(11); ctx.fillStyle = INK3;
  // above both rows of decision names on the timeline, so neither is written across the other
  let at = H - BOT - 70 - above - VIEW.limitation_lines.length*16;
  const from = at;
  let wide = 0;
  for (const one of VIEW.limitation_lines){
    ctx.fillText(one, padX, at);
    wide = Math.max(wide, ctx.measureText(one).width);
    at += 16;
  }
  // the box the limitation stands in, so a gate can prove nothing is written across it
  limitBox = {x0: padX, y0: from - 9, x1: padX + wide, y1: at - 16 + 3};
}
/** where the limitation stands, once it has been drawn */
let limitBox = null;

/**
 * One line of the readout, right against the edge of the frame, on the rows it needs.
 *
 * Nothing is ever cut, nothing is ever dropped and nothing is ever fine print. The plan holds
 * the rows this line was broken into and the size it reads at; this writes them one under the
 * other, from the row it is given down.
 */
function say(plan, y, col){
  if (!plan.rows.length) return;
  ctx.font = F(plan.size);
  ctx.fillStyle = col;
  ctx.textAlign = 'right';
  const edge = W - (compact ? 10 : 16);
  const drawn = [];
  for (let i = 0; i < plan.rows.length; i++){
    const at = y + i*ROWS.pitch;
    ctx.fillText(plan.rows[i], edge, at);
    drawn.push({text: plan.rows[i], y: at, x1: edge,
      x0: edge - ctx.measureText(plan.rows[i]).width});
  }
  ctx.textAlign = 'left';
  // one handle, so a gate can read what the band says, how big it says it and on which rows
  if (tree && tree.said) tree.said.push({text: plan.text, size: plan.size, color: col, y: y,
    rows: drawn});
}

/**
 * The band under the picture, in the order the dense-network contract fixes.
 *
 * The disaster decision and its deadline; what this scout, reviewer, coordinator or checker
 * actually said or did, beside which kind of node it is and its place in the method; whether the
 * proposal changed the modeled state, with the plain rule where it did not; and the modeled change
 * at this one moment, which is written "at this moment" because the clock opens modeled demand on
 * its own between two decisions and none of that belongs to this action.
 *
 * The first two lines have the whole width. The last two share their row with the controls and
 * stop short of them. A line too long for its own width is written on a second row rather than
 * off the edge of the frame, so the whole band stands on as many rows as its lines need, with
 * the last of them always on the bottom row.
 */
function drawReadout(padX, n){
  const s = states[sel] || 'pending';
  const room = W - padX*2;
  const rail = (W - padX) - (tp.offsetLeft + tp.offsetWidth + 14);
  const hue = GLYPH[n.cls] || {live: INK};
  const moment = n.moment;
  tree.said = [];

  // The earthquake is a record, not a decision, so it says what it is and stops. No proposal,
  // no rule and no state line is ever written for it.
  if (n.incident){
    say(ROWS.plan([n.action], room), H + ROWS.at(ROWS.base)[0], INK);
    return;
  }
  const lines = [
    // (1) which disaster decision this is, and its deadline
    {bits: [moment.situation], room: room, col: INK2},
    // (2) what this node said or did, and (3) its class and its place in the method
    {bits: [n.action, n.readout[1]], room: room, col: s === 'pending' ? INK3 : hue.live},
    // (4) whether the proposal changed the modeled state, and the rule where it did not
    {bits: [s === 'pending' ? VIEW_WORDS.waiting : moment.verdict], room: rail,
      col: n.admitted === false ? BAD : INK},
    // (5) the modeled change at this one moment
    {bits: [moment.change], room: rail, col: INK2},
  ];
  const held = lines.map((one) => ROWS.plan(one.bits, one.room));
  let rows = 0;
  for (const one of held) rows += one.rows.length;
  const ROW = ROWS.at(rows).map((one) => H + one);
  let row = 0;
  for (let i = 0; i < lines.length; i++){
    say(held[i], ROW[row], lines[i].col);
    row += held[i].rows.length;
  }
}

/**
 * The whole phrase this node can stand beside, or nothing.
 *
 * The bake writes each phrase several ways, from the longest form to the shortest, and none of
 * them is ever cut short or ended in a row of dots. This takes the longest form that stands inside
 * the width a phrase beside a node may have and still fits in the frame beside the gem.
 */
function roomFor(i){
  const o = scr[i], n = tree.nodes[i];
  if (!o || !n) return '';
  ctx.font = F(11);
  for (const said of n.labels){
    if (!said) continue;
    const w = ctx.measureText(said).width;
    if (w > VIEW_WORDS.labelWidth) continue;
    // where the frame writes this phrase, which is the side the component's own tag chooses
    const right = (o.x + 16 + w <= W - 8);
    if (!right && o.x - 16 - w < 8) continue;
    const x0 = right ? o.x + 16 : o.x - 16 - w;
    let y0 = o.y + TOP - 12;
    if (y0 < TOP + 14) y0 = o.y + TOP + 20;
    if (keyBox && x0 < keyBox.x1 && x0 + w > keyBox.x0
      && y0 - 8 < keyBox.y1 && y0 + 8 > keyBox.y0) continue;
    return said;
  }
  return '';
}

function drawSpark(x,y,w,h){
  hair(x, y+h, x+w, y+h, RULE);
  const n = Math.min(HIST, histN);
  if (n > 1){
    ctx.beginPath();
    for (let i=0;i<n;i++){
      const idx = (histN - n + i + HIST*2) % HIST;
      const v = Math.min(1, hist[idx]/2100);
      const px = x + (i/(n-1))*w;
      const py = y + h - v*h;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.strokeStyle = ACC; ctx.lineWidth = 1; ctx.stroke();
  }
  const last = hist[(histN-1+HIST)%HIST] || 0;
  const ly = y + h - Math.min(1,last/2100)*h;
  ctx.fillStyle = ACCHI; ctx.fillRect(x+w-2, Math.round(ly)-1, 3, 3);
}

function drawNodeMarks(t){
  if (!gl_ok) return;
  for (let i=0;i<tree.nodes.length;i++){
    if (states[i] !== 'running') continue;
    const s = scr[i]; if (!s || !s.vis) continue;
    ctx.globalAlpha = 0.45 + 0.45*(0.5 + 0.5*Math.sin(t*3.4 + i));
    cross(s.x, s.y + TOP, 6, ACCHI);
    ctx.globalAlpha = 1;
  }
  for (let i=0;i<tree.nodes.length;i++){
    if (states[i] !== 'pruned') continue;
    const s = scr[i]; if (!s || !s.vis) continue;
    ctx.strokeStyle = BAD; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x-4.5, s.y+TOP-4.5); ctx.lineTo(s.x+4.5, s.y+TOP+4.5);
    ctx.moveTo(s.x+4.5, s.y+TOP-4.5); ctx.lineTo(s.x-4.5, s.y+TOP+4.5);
    ctx.stroke();
  }
  // every node carries its class glyph as well as its colour, so a reader who cannot tell the
  // hues apart still reads the network; a node the replay has not reached yet carries none
  ctx.globalAlpha = 0.92;
  tree.drawn = [];
  for (let i=0;i<tree.nodes.length;i++){
    const o = scr[i]; if (!o || !o.vis) continue;
    const cls = GLYPH[tree.nodes[i].cls];
    if (!cls) continue;
    const waiting = states[i] === 'pending';
    ctx.globalAlpha = waiting ? 0.45 : 0.92;
    glyph(cls.glyph, o.x, o.y + TOP, 4.5, waiting ? cls.done : cls.live);
    // An agent the decision called in keeps the shape of the work it did and gains one ring, in
    // the colour the campaign gives called-in work. The shape says what it did; the ring says it
    // was not on the team when the decision began.
    const called = tree.nodes[i].added ? GLYPH.called_in : null;
    if (called){
      ctx.strokeStyle = waiting ? called.done : called.live;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(o.x, o.y + TOP, 7.5, 0, Math.PI*2);
      ctx.stroke();
    }
    // one handle, so a gate can read which shape every drawn node is wearing
    tree.drawn.push({id:i, cls:cls.id, glyph:cls.glyph,
      color: waiting ? cls.done : cls.live, waiting: waiting,
      ring: called ? (waiting ? called.done : called.live) : null});
  }
  ctx.globalAlpha = 1;
  // a rejected proposal carries a mark as well as a colour, so its state is never colour alone
  for (let i=0;i<tree.nodes.length;i++){
    if (tree.nodes[i].cls !== 'rejected' || states[i] === 'pending') continue;
    const s = scr[i]; if (!s || !s.vis) continue;
    ctx.strokeStyle = BAD; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x-4.5, s.y+TOP-4.5); ctx.lineTo(s.x+4.5, s.y+TOP+4.5);
    ctx.moveTo(s.x+4.5, s.y+TOP-4.5); ctx.lineTo(s.x-4.5, s.y+TOP+4.5);
    ctx.stroke();
  }
  if (hover >= 0 && hover !== sel && scr[hover] && scr[hover].vis){
    const said = roomFor(hover);
    if (said){
      cross(scr[hover].x, scr[hover].y+TOP, 8, INK);
      tag(said, scr[hover].x, scr[hover].y+TOP, INK2);
    }
  }
  const s = scr[sel];
  if (s && s.vis){
    const x = Math.round(s.x), y = Math.round(s.y)+TOP, r = 11;
    ctx.strokeStyle = ACCHI; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x-r+0.5,y-r+3.5); ctx.lineTo(x-r+0.5,y-r+0.5); ctx.lineTo(x-r+3.5,y-r+0.5);
    ctx.moveTo(x+r-3.5,y-r+0.5); ctx.lineTo(x+r-0.5,y-r+0.5); ctx.lineTo(x+r-0.5,y-r+3.5);
    ctx.moveTo(x+r-0.5,y+r-3.5); ctx.lineTo(x+r-0.5,y+r-0.5); ctx.lineTo(x+r-3.5,y+r-0.5);
    ctx.moveTo(x-r+3.5,y+r-0.5); ctx.lineTo(x-r+0.5,y+r-0.5); ctx.lineTo(x-r+0.5,y+r-3.5);
    ctx.stroke();
    const said = roomFor(sel);
    // the phrase keeps its own kind's colour, so the picture and the key never disagree; the
    // bracket and the ring are what say which node is open
    const hue = GLYPH[tree.nodes[sel].cls] || {live: ACCHI};
    if (said){ tag(said, x, y, hue.live); tree.tagged = {text: said, color: hue.live}; }
    else tree.tagged = null;
  }
}

function tag(text, x, y, col){
  ctx.font = F(11);
  const w = ctx.measureText(text).width;
  let tx = x + 16, ty = y - 12;
  const right = (tx + w <= W - 8);
  if (!right) tx = x - 16 - w;
  if (ty < TOP + 14) ty = y + 20;
  hair(x + (right?11:-11), y, tx + (right?-4:w+4), ty+3, RULE2);
  ctx.fillStyle = col; ctx.fillText(text, tx, ty+4);
}

function drawTimeline(padX){
  const x0 = padX + (compact ? ((tp.offsetWidth||90) + 12) : 0);
  const x1 = W - padX;
  // the one approved layout exception: the timeline overlays the bottom edge of the picture, so
  // the band below it is left clear for the four lines of the readout and the controls
  const y  = H - BOT - 26;
  // and the band reserves a row for every row it draws, so the line rises with it and no row of
  // the readout is ever written across it
  const line = y - ROWS.above();
  if (x1 - x0 < 60 || !tree.total) return;
  const map = u => x0 + (u/tree.total)*(x1-x0);

  hair(x0, line, x1, line, RULE2);
  // One mark for each of the eleven decisions: the hour of the earthquake the record gives it
  // below the line, and what the decision itself was about above the line, so the picture reads
  // as a run of disaster decisions and not as an abstract graph. The open decision's own name is
  // the bright one.
  const room = (x1 - x0) / tree.moments.length;
  const openAt = (tree.nodes[sel] || {}).decision;
  ctx.font = F(11);
  tree.anchorsDrawn = [];
  for (const moment of tree.moments){
    const px = map(moment.decision + 1);
    hair(px, line, px, line + 6, RULE2);
    if (compact) continue;
    label(Math.round(moment.hours*10)/10 + VIEW_WORDS.tickUnit, px, line+18, 'center', INK3);
    // Two rows, one above the other, so every name has twice its own share of the line and none
    // is written across another. The longest form that stands in that room is the one written,
    // and no form is ever cut short.
    const row = moment.decision % 2;
    const at = line - (row ? 34 : 20);
    let said = '';
    for (const form of moment.anchors){
      if (ctx.measureText(form.toUpperCase()).width + 0.88*form.length <= room*2 - 10){
        said = form; break;
      }
    }
    if (!said) continue;
    const open = moment.decision === openAt;
    label(said, px, at, 'center', open ? ACCHI : INK3);
    tree.anchorsDrawn.push({decision: moment.decision, text: said, open: open, x: px, row: row,
      size: 11, width: ctx.measureText(said.toUpperCase()).width + 0.88*said.length});
  }
  if (!compact){
    const said = VIEW_WORDS.timeline(tree.decisions);
    ctx.font = F(11);
    const room = map(1) - x0 - 10;
    if (ctx.measureText(said.toUpperCase()).width + 0.88*said.length <= room){
      label(said, x0, line+18, 'left', INK3);
    }
  }

  const cols = {};
  for (let i=0;i<tree.nodes.length;i++){
    const n = tree.nodes[i];
    if (!n.reach) continue;
    const px = Math.round(map(n.open));
    const st = cols[px] || 0;
    cols[px] = st + 1;
    const s = states[i];
    ctx.fillStyle = (s==='done') ? ACC : (s==='running') ? ACCHI : (s==='pruned') ? BAD : '#3a3a40';
    ctx.fillRect(px-2, line - 6 - Math.min(st,3)*3, 4, 2);
  }

  const px = map(Math.min(p, tree.total));
  ctx.strokeStyle = ACCHI; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Math.round(px)+0.5, line-18); ctx.lineTo(Math.round(px)+0.5, line+7); ctx.stroke();
  ctx.fillStyle = ACCHI;
  ctx.beginPath();
  ctx.moveTo(px, line-18); ctx.lineTo(px-3.5, line-24); ctx.lineTo(px+3.5, line-24); ctx.closePath(); ctx.fill();
}

function drawGrain(){
  if (!noiseTile || D.grain <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = D.grain * 0.6;
  const ox = -Math.floor(Math.random()*128), oy = -Math.floor(Math.random()*128);
  for (let x=ox; x<W; x+=128) for (let y=oy; y<H; y+=128) ctx.drawImage(noiseTile, x, y);
  ctx.globalAlpha = D.grain * 0.10;
  ctx.fillStyle = '#c9c9c9';
  for (let y=TOP; y<H-BOT; y+=3) ctx.fillRect(0, y, W, 1);
  ctx.restore();
}

/* ---------------------------------------------------------------- pointing */
let camAz = 0.42, camEl = 0.24, drift = 0, dragging = false, lastX = 0, lastY = 0, moved = 0;
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();

function pointerNode(cx, cy){
  if (!gl_ok || !nodeMesh) return -1;
  const r = glc.getBoundingClientRect();
  if (r.width < 1 || r.height < 1) return -1;
  ptr.x = ((cx - r.left)/r.width)*2 - 1;
  ptr.y = -((cy - r.top)/r.height)*2 + 1;
  if (ptr.x < -1 || ptr.x > 1 || ptr.y < -1 || ptr.y > 1) return -1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(nodeMesh, false);
  return (hit && hit.length && hit[0].instanceId !== undefined) ? hit[0].instanceId : -1;
}
function onButton(t){ return !!(t && t.classList && t.classList.contains('btn')); }

stage.addEventListener('pointerdown', e=>{
  if (onButton(e.target)) return;
  stage.focus({preventScroll:true});
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  stage.classList.add('drag');
  if (stage.setPointerCapture){ try { stage.setPointerCapture(e.pointerId); } catch(_){} }
});
stage.addEventListener('pointermove', e=>{
  if (dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    camAz -= dx*0.006;
    camEl = Math.max(-0.12, Math.min(0.95, camEl + dy*0.004));
    drift = 0;
  } else if (!onButton(e.target)) {
    hover = pointerNode(e.clientX, e.clientY);
    stage.classList.toggle('pick', hover >= 0);
  }
});
stage.addEventListener('pointerup', e=>{
  if (!dragging) return;
  dragging = false; stage.classList.remove('drag');
  if (moved < 5){
    const id = pointerNode(e.clientX, e.clientY);
    if (id >= 0){ sel = id; userPicked = true; }
  }
});
stage.addEventListener('pointercancel', ()=>{ dragging = false; stage.classList.remove('drag'); });
stage.addEventListener('pointerleave', ()=>{ hover = -1; stage.classList.remove('pick'); });

stage.addEventListener('keydown', e=>{
  if (onButton(e.target)) return;
  const n = tree.nodes[sel];
  if (!n) return;
  if (e.key === ' '){ setPlaying(!playing); e.preventDefault(); return; }
  if (e.key === 'ArrowRight'){
    if (n.kids.length){ sel = n.kids[0]; userPicked = true; }
    e.preventDefault(); return;
  }
  if (e.key === 'ArrowLeft'){
    if (n.parent >= 0){ sel = n.parent; userPicked = true; }
    e.preventDefault(); return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    if (n.parent >= 0){
      const sib = tree.nodes[n.parent].kids;
      const i = sib.indexOf(sel);
      const d = (e.key === 'ArrowUp') ? -1 : 1;
      if (i >= 0 && sib.length) sel = sib[(i + d + sib.length) % sib.length];
      userPicked = true;
    }
    e.preventDefault();
  }
});

function setPlaying(v){
  playing = v;
  bPlay.textContent = v ? '一時停止' : '再生';
  bPlay.setAttribute('data-on', v ? '1' : '0');
  bPlay.setAttribute('aria-pressed', String(!v));
}
bPlay.addEventListener('click', ()=> setPlaying(!playing));
bAgain.addEventListener('click', ()=>{ p = 0; endHold = 0; userPicked = false; sel = 0; setPlaying(true); });
bNew.addEventListener('click', ()=> newRun());
bMethod.addEventListener('click', ()=>{ stepAxis = 'method'; newRun(); });

/**
 * The campaign control: the second accepted production run, and the way back.
 *
 * Each accepted run has its own file, its own methods and its own seeds, so moving between them
 * reloads the page on the run asked for. Nothing else in the address is carried over, so the page
 * opens on that run's own first seed and first method.
 */
bCampaign.textContent = ON_GROWTH
  ? VIEW_WORDS.campaignControl.toAccepted
  : VIEW_WORDS.campaignControl.toGrowth;
bCampaign.addEventListener('click', ()=>{
  location.href = location.pathname + (ON_GROWTH ? '' : '?campaign=growth');
});

/** the method control carries the name of the method on screen, the way Pause carries its own */
function sayMethod(){
  bMethod.textContent = VIEW_WORDS.methodControl(tree.methodLabel);
}

function newRun(){
  seed = (seed*1664525 + 1013904223) >>> 0;
  tree = buildTree(seed);
  sayMethod();
  states = new Array(tree.nodes.length).fill('');
  scr.length = 0;
  sel = 0; hover = -1; userPicked = false; p = 0; endHold = 0;
  buildScene();
  resolveStates(); paintStates();
  setPlaying(true);
}

/* ------------------------------------------------------------------- dials */
window.setDial = function(name, value){
  const v = Number(value);
  if (!isFinite(v) || !Object.prototype.hasOwnProperty.call(D, name)) return;
  D[name] = v;
  if (name === 'glow'){ if (haloMat) haloMat.uniforms.uGlow.value = v; }
  else if (name === 'edge'){ if (edgeLine) edgeLine.material.opacity = v; }
  else if (name === 'spread'){ if (gl_ok){ placeTree(tree); refreshGeometry(); } }
  else if (name === 'grid') rebuildGrid();
  else if (name === 'dim') paintStates();
  else if (name === 'flow') rebuildFlow();
  else if (name==='soft'||name==='az'||name==='el'||name==='ilev'||name==='warm'||name==='amb'||name==='rim') applyLights();
};

/* -------------------------------------------------------------- frame loop */
let last = 0, clock = 0, histT = 0, raf = 0;

function frame(now){
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, last ? (now-last)/1000 : 0.016);
  last = now; clock += dt;

  if (playing){
    p += dt * 0.42 * D.tempo;
    if (p >= tree.total){
      p = tree.total;
      endHold += dt;
      if (endHold > 1.6){ newRun(); return; }
    }
  }

  let live = 0;
  for (let i=0;i<tree.nodes.length;i++) if (states[i] === 'running') live++;
  const s = signal(clock, dt, live);
  histT += dt;
  if (histT > 0.055){ histT = 0; hist[histN % HIST] = s; histN++; }

  if (resolveStates()) paintStates();

  if (!userPicked){
    let best = -1, bt = -1;
    for (let i=0;i<tree.nodes.length;i++){
      if (states[i] === 'running' && tree.nodes[i].open > bt){ bt = tree.nodes[i].open; best = i; }
    }
    if (best >= 0) sel = best;
  }

  if (gl_ok && nodeMesh){
    if (!dragging) drift += dt;
    const az = camAz + Math.sin(drift*0.13)*0.10;
    const dist = 12.2 * D.depth;
    camera.position.set(
      target.x + dist*Math.sin(az)*Math.cos(camEl),
      target.y + dist*Math.sin(camEl) + 1.1,
      target.z + dist*Math.cos(az)*Math.cos(camEl));
    camera.lookAt(target);

    for (let i=0;i<tree.nodes.length;i++){
      const st = states[i];
      let sc = (st==='pending') ? 0.62 : (st==='skipped') ? 0.5 : (st==='pruned') ? 0.8 : 1;
      if (st === 'running') sc = 1.12 + 0.16*Math.sin(clock*5.2 + i*1.7);
      if (i === sel) sc *= 1.12;
      tmpAx.set(0.3,1,0.2).normalize();
      tmpM.compose(tree.nodes[i].pos, tmpQ.setFromAxisAngle(tmpAx, clock*0.35 + i), tmpS.set(sc,sc,sc));
      nodeMesh.setMatrixAt(i, tmpM);
    }
    nodeMesh.instanceMatrix.needsUpdate = true;

    const hs = haloGeo.getAttribute('aSize'), ha = haloGeo.getAttribute('aAlpha'), hc = haloGeo.getAttribute('aColor');
    for (let i=0;i<tree.nodes.length;i++){
      const st = states[i];
      let size, alpha, cr = 0.09, cg = 0.30, cb = 0.66;
      if (st === 'running'){ size = 1.5 + 0.35*Math.sin(clock*5.2 + i*1.7); alpha = 1; cr=0.30; cg=0.55; cb=0.95; }
      else if (st === 'done'){ size = 0.72; alpha = 0.5; }
      else if (st === 'pruned'){ size = 0.86; alpha = 0.55; cr=0.70; cg=0.09; cb=0.14; }
      else { size = 0.34; alpha = 0.12*(1 - D.dim*0.8); cr=0.16; cg=0.18; cb=0.22; }
      if (i === sel){ size *= 1.35; alpha = Math.max(alpha, 0.6); }
      hs.array[i] = size*0.9; ha.array[i] = alpha;
      hc.array[i*3] = cr; hc.array[i*3+1] = cg; hc.array[i*3+2] = cb;
    }
    hs.needsUpdate = true; ha.needsUpdate = true; hc.needsUpdate = true;

    const fp = flowGeo.getAttribute('position');
    for (let i=0;i<flow.length;i++){
      const f = flow[i];
      f.off += dt * (0.30 + 0.12*(((f.e*7)%5)/5)) * D.tempo;
      if (f.off > 1) f.off -= 1;
      const a = tree.nodes[tree.edges[f.e][0]].pos, b = tree.nodes[tree.edges[f.e][1]].pos;
      ctrlPoint(a,b,tmpV2);
      bez(a,tmpV2,b,f.off,tmpV);
      fp.array[i*3] = tmpV.x; fp.array[i*3+1] = tmpV.y; fp.array[i*3+2] = tmpV.z;
    }
    fp.needsUpdate = true;

    if (ring && tree.nodes[sel]){
      ring.position.copy(tree.nodes[sel].pos);
      ring.lookAt(camera.position);
      ring.rotation.z = clock*0.6;
      ring.material.opacity = Math.max(0, Math.min(1, 0.55 + 0.25*Math.sin(clock*2.4)));
    }

    renderer.render(scene, camera);

    for (let i=0;i<tree.nodes.length;i++){
      tmpProj.copy(tree.nodes[i].pos).project(camera);
      const o = scr[i] || (scr[i] = {x:0,y:0,vis:false});
      o.x = (tmpProj.x*0.5+0.5)*FW;
      o.y = (-tmpProj.y*0.5+0.5)*FH;
      o.vis = (tmpProj.z < 1) && o.x > -40 && o.x < FW+40 && o.y > -40 && o.y < FH+40;
    }
  }

  drawHud(clock);
}

/* --------------------------------------------------------------- lifecycle */
noiseTile = makeNoise();
tree = buildTree(seed);
sayMethod();
states = new Array(tree.nodes.length).fill('');
layout();
buildScene();
resolveStates();
paintStates();
setPlaying(true);

if ('ResizeObserver' in window){ new ResizeObserver(()=>layout()).observe(stage); }
else window.addEventListener('resize', layout);

document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){ if (raf) cancelAnimationFrame(raf); raf = 0; }
  else if (!raf){ last = 0; raf = requestAnimationFrame(frame); }
});

if (Array.isArray(window.__dq)){
  for (const q of window.__dq) window.setDial(q[0], q[1]);
  window.__dq.length = 0;
}

raf = requestAnimationFrame(frame);
}
</script>

<script>
/* liveref dials runtime — the canvas drawer drives these values */
(()=>{ const el=document.getElementById('liveref-dials');
  if(!el) return;
  const dials=JSON.parse(el.textContent);
  addEventListener('message', e=>{ const m=e.data||{};
    if (m.liveref==='set') window.setDial?.(m.name, m.value);
    if (m.liveref==='init') for (const k in (m.values||{})) window.setDial?.(k, m.values[k]); });
  parent.postMessage({liveref:'dials', list:dials}, '*');
})();
</script>
