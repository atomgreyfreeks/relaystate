 * the one decision a viewer has opened. The build refuses to draw more than this.
 */
const MAXN = 600;
/** the layout is fixed, so the same analysis always draws the same picture */
const LAYOUT_SEED = 20260827;
/** how long before its recorded deadline a decision reads as open, in hours */
const WINDOW_HOURS = 2;
/** which of the campaign's seeds the next build shows. The seed control steps it on and wraps. */
let seedAt = 0;
/** true while a build is redrawing the run on screen rather than stepping to the next seed */
let holdSeed = false;
/** which decision's agent work is open, as the branch and the decision it belongs to */
let openBranch = -1, openDecision = -1;
/** true while the story shows the exact per-seed readings instead of its four sentences */
let storyDetails = false;

/**
 * One tint and one shape per kind of agent step, so a viewer can read a step without touching it.
 *
 * The auditor set these kinds, their colours and their shapes for the dense network page, and the
 * bake carries them. They are used here for the agent steps alone: a trajectory node keeps the
 * component's own playback colours, so the five trajectories read exactly as they did before.
 */
const TINT = {};
const tintFor = (cls) => TINT[cls] || {live:C_LIVE, done:C_DONE};
/** the same kinds by name, for the shape and the colour the key and the readout draw */
const GLYPH = {};
/** the two kinds of edge: what one agent passed to the next, and what a decision carried on */
const EDGE_TINT = {};
/**
 * The kind the campaign gives to help a decision called in, where the campaign records one.
 *
 * The growth run names one kind more than the first campaign does. An agent called in keeps the
 * shape of the work it did — a scout finding, a reviewer judgment — and wears this kind's ring as
 * well, so a reader sees both what it did and that it was called in. The first campaign called
 * none in and names no such kind, so this stands empty there.

let CALLED_IN = null;
/**
 * Read the kinds of step and of line out of the campaign now on screen.
 *
 * Each campaign names its own kinds, their colours and their shapes in its own file. This runs
 * again whenever the campaign control changes which file the page reads, so nothing here is ever
 * left over from the other campaign.

function readClasses(){
  for (const held of [TINT, GLYPH, EDGE_TINT]) for (const id in held) delete held[id];

    TINT[one.id] = {live:new THREE.Color(one.live), done:new THREE.Color(one.done)};

  }

readClasses();

/**
 * The room the frame keeps for the words beside the picture.
 *
 * The left column holds the counters, the method sentence and the key. A frame this wide also
 * holds a readout column at the right. The story stands across the top between them, and the run
 * itself is laid out inside what is left, so no part of the picture is ever drawn behind a word.

const COLUMN = 250;
const PANEL = 320;
const PANEL_FROM = 1600;
/**
 * How wide the receipt run's own strip stands, in pixels, at the right of the story.

 * under them the room the contract fixes for it.

/**
 * How the run is shaped so that it stands clear of those words.
 *

 * the two columns of words, at both frame sizes. Nothing about the run itself changes: the same
 * five trajectories, the same eleven decisions, in the same order.
 */
const RUN_ACROSS = 0.75;
const RUN_AROUND = 0.46;
const RUN_SLIDE = 0.10;
/** the room the run keeps from the story above it and from the line under it, in pixels */
const RUN_ROOM = 34;

 * The room the left column keeps, and the least it keeps where a long sentence fills it.

const READING_TIGHT = 16;
const KEY_TIGHT = 12;

/** the earthquake's own clock at a point on the playhead, counted from the recorded minute */
function clockAt(u){
  const mins = VIEW.incident.startMinute + Math.round(u * SEC_PER_UNIT * 60);
  const day = VIEW.incident.startDay + Math.floor(mins/1440);
  const held = ((mins % 1440) + 1440) % 1440;
  const two = n => ('0'+n).slice(-2);
  return day + ' ' + VIEW.incident.month + '  ' + two(Math.floor(held/60)) + ':' + two(held%60);
}

function mulberry32(sd){
  let a = sd>>>0;
  return function(){
    a = (a + 0x6D2B79F5)|0;
    let t = Math.imul(a ^ (a>>>15), 1|a);
    t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}

let tree = null, seed = 20260826;

/**
 * The agent work recorded inside one decision of one method, from the accepted run.

 * the impact record on screen can only ever be the same decision of the same seed and method.

function agentViewOf(seed, methodId){
  return AGENT_WORK.views.find(one => one.seed === seed && one.method_id === methodId) || null;
}

  const cell = (node && node.artifact && node.artifact.cell) ? node.artifact.cell : '';

  return at < 0 ? '' : cell.slice(at + 1);

/**
 * How the agent work of one decision is laid out around it.

 * inboard of the trajectory they belong to, at the same angle around the run, rather than further
 * out than it: an early decision stands near the run's own axis and a late one far out, and the
 * work of either has to fit in the same room. On that band the picture never grows when a

    let par = root;

   *

   * of the same seed and method the trajectory node stands for. The stages read left to right in
   * the order the method ran them, and the three lanes stand off the trajectory so the run itself

        cls: row.cls, agent: row.agent, stage: row.stage, stages: agentView.stages,
        // where the campaign recorded that this agent was called in rather than standing on the

        methodLabel: agentView.method_label, seed: agentView.seed,

        labels: row.labels, readout: row.readout, chips: row.chips,

let firstBuild = true;

/**
 * The path one agent step stands on, inside its own decision.
 *
 * Everything that reached this step and everything this step reached: what it was handed,
 * upstream, and the proposal, the admission and the state it led to, downstream. The rest of the
 * picture keeps its colour and stands back, so nothing is hidden and a viewer keeps their bearings.
 * A trajectory node isolates nothing: the five trajectories always read as they did before.
 */
function pathFrom(at){
  if (!tree || at < 0 || at >= tree.nodes.length || !tree.nodes[at].cls) return {nodes:null, edges:null};
  const heldNodes = new Set([at]), heldEdges = new Set();
  const walk = (from, way, only) => {
    const queue = [from];
    const seen = new Set([from]);
    while (queue.length){
      const id = queue.pop();
      for (const e of tree.nodes[id][way]){
        if (only && tree.edges[e].kind !== only) continue;
        const next = tree.edges[e][way === 'in' ? 0 : 1];
        heldEdges.add(e);
        heldNodes.add(next);
        if (!seen.has(next)){ seen.add(next); queue.push(next); }
      }
    }
  };
  walk(at, 'in', 'information');
  walk(at, 'out', 'information');
  for (const id of [...heldNodes]){
    walk(id, 'in', 'carry');
    walk(id, 'out', 'carry');
  }
  return {nodes:heldNodes, edges:heldEdges};
}

/**
 * Where the whole network of the run on screen is read, which the full-network control opens.
 *
 * The link names the seed and the method the reader is standing on, and, while the growth run is
 * the one on screen, the campaign as well, so the network page opens that campaign's own record
 * rather than the first one's.
 */
function fullHref(){
  const branch = tree && tree.nodes[sel] ? tree.nodes[sel].branch : -1;
  const one = (branch >= 0 && tree.branches[branch] && tree.branches[branch].kind === 'method')
    ? tree.branches[branch].method_id : AGENT_WORK.method_order[0];
  return '/decision-network.html?seed=' + (tree ? tree.seed : '') + '&method=' + one

/**
 * Which decision's agent work belongs open, from the step or the decision a viewer is standing on.
 *
 * One decision at a time. Standing on a trajectory node opens that decision's own work; standing
 * on one of its steps keeps it open; standing on the earthquake or on the public record opens
 * none, because the record is context and carries no agent work.
 */
function wantsOpen(){
  const n = tree ? tree.nodes[sel] : null;
  if (!n || n.branch < 0) return [-1, -1];
  const branch = tree.branches[n.branch];
  if (!branch || branch.kind !== 'method') return [-1, -1];
  if (n.cls) return [n.branch, n.decision];
  const rows = branch.tiers.flatMap(tier => tier.records);
  const at = rows.findIndex(one => one.decision_slot_id === n.slotId);
  return at < 0 ? [-1, -1] : [n.branch, at];
}

/** draw the same run again, with a different decision opened, keeping the seed and the playhead */
function regrow(){
  const keep = sel, kept = userPicked;
  holdSeed = true;
  tree = buildTree(seed);
  holdSeed = false;
  states = new Array(tree.nodes.length).fill('');
  scr.length = 0;
  sel = Math.min(keep, tree.nodes.length - 1);
  userPicked = kept;
  grow = 0;
  buildScene();
}
/** how far the open decision's work has opened out from its own trajectory node, eased */
let grow = 1;

function placeTree(tr){
  for (const nd of tr.nodes){
    const rad = (nd.rad||0) * D.spread;
    if (!nd.pos) nd.pos = new THREE.Vector3();
    nd.pos.set(nd.tier*1.5 - 4.4, 1.95 + Math.sin(nd.ang)*rad*0.52, Math.cos(nd.ang)*rad*1.02);
  }
}

let nodeMesh=null, edgeLine=null, halo=null, flowPts=null, gridLines=null, floor=null, ring=null;
let haloGeo=null, edgeGeo=null, flowGeo=null;

const EDGE_SEG = 8, MAXFLOW = 420;
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(),
      tmpS = new THREE.Vector3(), tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(),
      tmpAx = new THREE.Vector3(), tmpProj = new THREE.Vector3();

const haloMat = gl_ok ? new THREE.ShaderMaterial({
  uniforms:{ uPx:{value:400}, uGlow:{value:1} },
  vertexShader:[
    'attribute float aSize;','attribute float aAlpha;','attribute vec3 aColor;',
    'varying vec3 vC; varying float vA; uniform float uPx;',
    'void main(){ vC = aColor; vA = aAlpha;',
    '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
    '  gl_PointSize = aSize * uPx / max(0.001, -mv.z);',
    '  gl_Position = projectionMatrix * mv; }'
  ].join('\n'),
  fragmentShader:[
    'varying vec3 vC; varying float vA; uniform float uGlow;',
    'void main(){ vec2 d = gl_PointCoord - 0.5; float r = length(d) * 2.0;',
    '  if (r > 1.0) discard;',
    '  float a = pow(1.0 - r, 2.4);',

function ctrlPoint(a, b, out){
  out.copy(a).add(b).multiplyScalar(0.5);
  out.y += 0.10;
  out.z *= 1.16;
  return out;
}
function bez(a, c, b, t, out){
  const it = 1-t, w0 = it*it, w1 = 2*it*t, w2 = t*t;
  out.set(a.x*w0 + c.x*w1 + b.x*w2, a.y*w0 + c.y*w1 + b.y*w2, a.z*w0 + c.z*w1 + b.z*w2);
  return out;
}

function buildScene(){

function buildFloor(){

function rebuildGrid(){
  if (!gl_ok) return;
  if (gridLines){ scene.remove(gridLines); gridLines.geometry.dispose(); gridLines.material.dispose(); gridLines = null; }
  const step = 1.15 / Math.max(0.4, D.grid);
  const hx = 7.2, hz = 5.4, arm = step*0.16;
  const pts = [];
  for (let x=-hx; x<=hx+1e-6; x+=step) pts.push(x,0,-hz, x,0,hz);
  for (let z=-hz; z<=hz+1e-6; z+=step) pts.push(-hx,0,z, hx,0,z);
  for (let x=-hx; x<=hx+1e-6; x+=step)
    for (let z=-hz; z<=hz+1e-6; z+=step)
      pts.push(x-arm,0.004,z, x+arm,0.004,z, x,0.004,z-arm, x,0.004,z+arm);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));

function buildLights(){

const COOL = new THREE.Color(0xc6d4ea), WARM = new THREE.Color(0xffd7ac);
function applyLights(){
  if (!key) return;
  const d = 13;
  key.position.set(target.x + d*Math.sin(D.az)*Math.cos(D.el),
                   target.y + d*Math.sin(D.el),

function disposeScene(){

    if (!o) return;

  });

  haloGeo=null; edgeGeo=null; flowGeo=null;

function refreshGeometry(){
  if (!gl_ok || !edgeGeo || !haloGeo) return;
  const pos = edgeGeo.getAttribute('position'), arr = pos.array;
  const cp = tmpV2;
  let k = 0;
  for (let e=0;e<tree.edges.length;e++){
    const a = tree.nodes[tree.edges[e][0]].pos, b = tree.nodes[tree.edges[e][1]].pos;
    ctrlPoint(a,b,cp);
    for (let s=0;s<EDGE_SEG;s++){
      bez(a,cp,b, s/EDGE_SEG, tmpV);      arr[k]=tmpV.x; arr[k+1]=tmpV.y; arr[k+2]=tmpV.z; k+=3;
      bez(a,cp,b,(s+1)/EDGE_SEG, tmpV);   arr[k]=tmpV.x; arr[k+1]=tmpV.y; arr[k+2]=tmpV.z; k+=3;
    }
  }
  pos.needsUpdate = true;
  const hp = haloGeo.getAttribute('position');
  for (let i=0;i<tree.nodes.length;i++){
    hp.array[i*3]   = tree.nodes[i].pos.x;
    hp.array[i*3+1] = tree.nodes[i].pos.y;
    hp.array[i*3+2] = tree.nodes[i].pos.z;
  }
  hp.needsUpdate = true;
}

/* --------------------------------------------------------------- run state */
let p = 2.6;
let playing = true;
let endHold = 0;
let sel = 0, hover = -1, userPicked = false;
let states = [];
let flow = [];

function resolveStates(){
  // the camera aims above the run, so the whole picture stands in the room the story and the line
  // under the picture leave it, and no part of it is ever drawn behind a word
  const want = 1.95 + aimFor();
  if (Math.abs(target.y - want) > 0.0005){ target.y = want; applyLights(); }
  const around = aroundFor();
  if (Math.abs(D.spread - around) > 0.0005){
    D.spread = around;
    placeTree(tree);
    refreshGeometry();
  }
  // one decision at a time: the agent work of the decision a viewer stands on, and no other
  const open = wantsOpen();
  if (open[0] !== openBranch || open[1] !== openDecision){
    openBranch = open[0];
    openDecision = open[1];
    regrow();
    return true;
  }
  // that work opens out from its own decision rather than appearing at its full reach
  if (grow < 1){
    grow += (1 - grow) * 0.18 + 0.012;
    if (grow > 0.999) grow = 1;
    for (const one of tree.nodes){
      if (!one.cls) continue;
      one.tier = one.homeTier + (one.outTier - one.homeTier) * grow;
      one.rad = one.homeRad + (one.outRad - one.homeRad) * grow;
    }
    placeTree(tree);
    refreshGeometry();
  }
  // Playback only: waiting, being shown, shown. A proposal the campaign did not admit still
  // stands on the branch and the branch carries on past it, exactly as the campaign did.
  // One pulse stands on screen at a time: the decision the replay is opening now. The others
  // resolve as the replay passes them, and an agent step never pulses at all.
  const nd = tree.nodes;
  let changed = false;
  let pulse = -1, latest = -1;
  for (let i=0;i<nd.length;i++){
    if (nd[i].cls) continue;
    if (p >= nd[i].open && p < nd[i].res && nd[i].open > latest){ latest = nd[i].open; pulse = i; }
  }
  for (let i=0;i<nd.length;i++){
    const n = nd[i];
    let s;
    if (p < n.open) s = 'pending';
    else if (p < n.res && i === pulse) s = 'running';
    else s = 'done';
    if (states[i] !== s){ states[i] = s; changed = true; }
  }
  // a new selection lights a new path through the open decision, which is a repaint and no more
  if (paintedSel !== sel){ paintedSel = sel; changed = true; }
  return changed;
}
/** which node the picture last painted its lit path from */
let paintedSel = -1;

/**
 * Where the camera aims, so the run stands in the room the words around it leave.
 *
 * The story is the first thing a reader reads and the line under the picture is the last, so the
 * run itself sits in the middle of what is left between them. The camera aims that far above the
 * run, which lowers the whole picture on screen without moving one node relative to the ground it
 * stands on. The camera keeps its own angle, its own distance and its own drift.
 */
function aimFor(){
  const from = (storyBox ? storyBox.y1 : TOP) + RUN_ROOM;
  const to = H - BOT - RUN_ROOM - 26;
  const per = FH / (2 * 12.2 * Math.max(0.1, D.depth) * Math.tan(38 * Math.PI / 360));
  const held = runOnScreen();
  if (!held) return ((from + to)/2 - (TOP + FH/2)) / Math.max(1, per);
  // eased toward the aim that puts the run's own middle in the middle of the room it has
  const step = (((from + to)/2 - (held.top + held.bottom)/2) / Math.max(1, per)) * 0.30;
  return (target.y - 1.95) + step;
}

/** where the run reaches on screen as it stands, from the frame's own last projection */
function runOnScreen(){
  let top = Infinity, bottom = -Infinity;
  for (let i = 0; i < scr.length; i++){
    const one = scr[i];
    if (!one || !one.vis) continue;
    top = Math.min(top, one.y + TOP);
    bottom = Math.max(bottom, one.y + TOP);
  }
  return (isFinite(top) && bottom > top) ? {top: top, bottom: bottom} : null;
}

/**
 * How far the run stands around its own axis, so it fits the room the words leave it.
 *
 * The story is read first and takes what it needs; the line under the picture takes what it needs;
 * the run is flattened just enough to stand in what is left. This is the component's own branch
 * spread, set from the frame rather than from a dial, so a narrow frame never draws one gem behind
 * one word. The room and the reach are both read from the frame as it stands, so no number here
 * has to be kept true by hand.
 */
function aroundFor(){
  const from = (storyBox ? storyBox.y1 : TOP) + RUN_ROOM;
  const to = H - BOT - RUN_ROOM - 26;
  const room = to - from;
  if (room < 40) return D.spread;
  // how far the run reaches on screen as it stands, which is what has to fit that room
  const held = runOnScreen();
  if (!held) return D.spread;
  const want = D.spread * (room / (held.bottom - held.top));
  // A narrow frame draws fewer pixels per step of the run, and standing further around the axis
  // also carries a node further from the camera, so the picture there grows more slowly than the
  // spread does. The run is allowed to stand further around its axis in a narrow frame, up to 1.8
  // rather than 1.0, which is what lets the picture reach the 220 pixels the contract asks of it:
  // at 1.7 the same picture stands 217.7 pixels at its shortest, whatever room the words leave it.
  const most = (W <= VIEW_WORDS.reading.narrowTo) ? 1.8 : 1;
  // eased, so the picture settles into its room rather than snapping between two sizes
  return Math.max(0.15, Math.min(most, D.spread + (want - D.spread) * 0.22));
}

function edgeLive(e){
  const a = states[tree.edges[e][0]], b = states[tree.edges[e][1]];
  if (b === 'pruned') return 2;
  if (b === 'running' || b === 'done') return 1;
  if (a === 'done' && b === 'pending') return 0.5;
  return 0;
}

/** how far back an unpicked trajectory, the public record and an unlit agent step stand */
const AWAY_BRANCH = 0.35, RECORD_FAINT = 0.62, AWAY_STEP = 0.30;

function paintStates(){
  if (!gl_ok || !nodeMesh || !edgeGeo) return;
  const dim = 0.18 + (1-D.dim)*0.9;
  // the trajectory a viewer stands on keeps its own brightness; the other four stand back, and
  // the public record stands back further still, because it is context and not an answer
  const here = tree.nodes[sel] ? tree.nodes[sel].branch : -1;
  const standing = (n) => {
    const one = (n.branch >= 0) ? tree.branches[n.branch] : null;
    let held = (here >= 0 && n.branch >= 0 && n.branch !== here) ? AWAY_BRANCH : 1;
    if (one && one.kind !== 'method') held *= RECORD_FAINT;
    return held;
  };
  // the lit path, where a viewer has picked one agent step; everything else keeps its colour and
  // stands back, so nothing is hidden and a viewer keeps their bearings
  const lit = pathFrom(sel);
  for (let i=0;i<tree.nodes.length;i++){
    // an agent step takes the colour of its own kind, from the key that decodes the picture
    const n = tree.nodes[i], hue = n.cls ? tintFor(n.cls) : null;
    const s = states[i];
    if (hue){
      const near = (lit.nodes && !lit.nodes.has(i)) ? AWAY_STEP : 1;
      if (s === 'pending') _pc.copy(hue.done).multiplyScalar(0.78 * near);
      else _pc.copy(hue.live).multiplyScalar(near);
    }
    else {
      const k = standing(n);
      if (s === 'running') _pc.copy(C_LIVE).multiplyScalar(k);
      else if (s === 'done') _pc.copy(C_DONE).multiplyScalar(k);
      else if (s === 'pruned') _pc.copy(C_BAD).multiplyScalar(k);
      else if (s === 'skipped') _pc.copy(C_SKIP).multiplyScalar(dim*k);
      else _pc.copy(C_PEND).multiplyScalar(dim*k);
    }
    nodeMesh.setColorAt(i, _pc);
  }
  if (nodeMesh.instanceColor) nodeMesh.instanceColor.needsUpdate = true;

  const col = edgeGeo.getAttribute('color'), arr = col.array;
  for (let e=0;e<tree.edges.length;e++){
    const lv = edgeLive(e);
    const edge = tree.edges[e];
    // the second kind of line: what one agent passed to the next runs thin and tapers along its
    // own line, and what the decision carried either side of it runs solid and brighter, end to end
    if (edge.agent){
      const near = (lit.edges && !lit.edges.has(e)) ? AWAY_STEP : 1;
      _ec.copy(EDGE_TINT[edge.carry ? 'carry' : 'information'])
        .multiplyScalar((lv >= 1 ? 1 : 0.30) * near);
    }
    else {
      const k = standing(tree.nodes[edge[1]]);
      if (lv === 2) _ec.setHex(0xb11020).multiplyScalar(0.9*k);
      else if (lv === 1) _ec.setHex(0x2f6ac4).multiplyScalar(k);
      else if (lv === 0.5) _ec.setHex(0x1a2740).multiplyScalar((0.7 + (1-D.dim)*0.6)*k);
      else _ec.setHex(0x1b1b21).multiplyScalar((0.35 + (1-D.dim)*1.1)*k);
    }
    const base = e*EDGE_SEG*2*3;
    for (let v=0; v<EDGE_SEG*2; v++){
      const f = (lv >= 1 && !edge.carry) ? (0.55 + 0.45*(v/(EDGE_SEG*2-1))) : 1;
      arr[base+v*3]   = _ec.r*f;
      arr[base+v*3+1] = _ec.g*f;
      arr[base+v*3+2] = _ec.b*f;
    }
  }
  col.needsUpdate = true;
  rebuildFlow();
}

function rebuildFlow(){
  if (!gl_ok || !flowGeo) return;
  flow.length = 0;
  const per = Math.max(1, Math.round(3*D.flow));
  for (let e=0;e<tree.edges.length;e++){
    if (edgeLive(e) !== 1) continue;
    for (let i=0;i<per;i++){
      if (flow.length >= MAXFLOW) break;
      flow.push({e:e, off:((i + 0.31*e) % per)/per});
    }
  }
  flowGeo.setDrawRange(0, flow.length);
}

/* --------------------------------------------------- synthesized live wire */
const HIST = 168;
const hist = new Float32Array(HIST);
let histN = 0, walkT = 0, walkA = 0, walkB = 0, sig = 900;

function signal(t, dt, active){
  // the wire is the record, not a synthesized number: the first counter of the branch on screen,
  // as it stood at the last decision the replay has passed on that branch
  const n = tree.nodes[sel] || tree.nodes[0];
  const branch = n.branch;
  let held = 0;
  for (let i=0;i<tree.nodes.length;i++){
    const row = tree.nodes[i];
    if (row.branch !== branch || !row.counters || states[i] === 'pending') continue;
    held = row.counters[VIEW.counter_fields[0]] || 0;
  }
  sig = held;
  return sig;
}

/* ------------------------------------------------------------ hud plumbing */
let W=560, H=380, TOP=46, BOT=76, FW=0, FH=0, compact=false, dpr=1;

function makeNoise(){
  const n = document.createElement('canvas');
  n.width = n.height = 128;
  const g = n.getContext('2d');
  if (!g) return null;
  const img = g.createImageData(128,128);
  for (let i=0;i<128*128;i++){
    const v = Math.random();
    const a = v > 0.86 ? Math.floor((v-0.86)*1500) : 0;
    img.data[i*4] = 210; img.data[i*4+1] = 214; img.data[i*4+2] = 224;
    img.data[i*4+3] = Math.min(90, a);

  return n;
}

function layout(){
