/* ------------------------------------------------------------ hud painting */
const F = w => w + 'px "Helvetica Neue",Helvetica,Arial,sans-serif';
function track(s, x, y, sp, align){
  let total = 0;
  for (let i=0;i<s.length;i++) total += ctx.measureText(s[i]).width + sp;
  total -= sp;
  let cx = (align==='right') ? x-total : (align==='center') ? x-total/2 : x;
  for (let i=0;i<s.length;i++){ ctx.fillText(s[i], cx, y); cx += ctx.measureText(s[i]).width + sp; }
}
function label(s,x,y,align,col){
  ctx.font = F(11); ctx.fillStyle = col || INK3;
  track(String(s).toUpperCase(), x, y, 0.88, align || 'left');
}
function num(s,x,y,size,align,col){
  ctx.font = F(size); ctx.fillStyle = col || INK;
  ctx.textAlign = align || 'left'; ctx.fillText(String(s), x, y); ctx.textAlign = 'left';
}
function hair(x0,y0,x1,y1,col){
  ctx.strokeStyle = col || RULE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Math.round(x0)+0.5, Math.round(y0)+0.5);
  ctx.lineTo(Math.round(x1)+0.5, Math.round(y1)+0.5); ctx.stroke();
}
function cross(x,y,a,col){
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(Math.round(x)-a, Math.round(y)+0.5); ctx.lineTo(Math.round(x)+a, Math.round(y)+0.5);
  ctx.moveTo(Math.round(x)+0.5, Math.round(y)-a); ctx.lineTo(Math.round(x)+0.5, Math.round(y)+a);
  ctx.stroke();
}

function drawHud(t){
  ctx.clearRect(0,0,W,H);
  const padX = compact ? 10 : 16;
  // nothing is claimed about the truth boundary until this frame has drawn it
  tree.boundary = null;

  ctx.fillStyle = '#0b0b0e';
  ctx.fillRect(0,0,W,TOP);
  ctx.fillRect(0,H-BOT,W,BOT);
  hair(0, TOP, W, TOP, RULE);
  hair(0, H-BOT, W, H-BOT, RULE);

  label(VIEW_WORDS.masthead, padX, compact?14:17, 'left', INK2);
  // where the header sentence stands. It reads in the head of the frame unless the sample line
  // owns that slot and the two will not stand in it together, and then it goes under the counters.
  let headerBelow = false;
  if (!compact){
    // the limitation stands in the head of the frame, beside the name of the run, at all times,
    // and the line under it says when these numbers are not a production result
    ctx.font = F(11);
    const wide = (s) => ctx.measureText(s.toUpperCase()).width + 0.88*s.length;
    ctx.fillStyle = INK3;
    ctx.fillText(VIEW.limitation, padX + wide(VIEW_WORDS.masthead) + 18, 17);
    const run = VIEW_WORDS.run(tree.seed, tree.tiers, tree.branches.length);
    num(run, padX, 34, 13, 'left', INK);
    // this row is read from the left and the incident clock is read from the right at the same
    // height, so the row stops where the clock begins and never crosses it
    ctx.font = F(28);
    const stop = W - padX - ctx.measureText(clockAt(Math.min(p, tree.total))).width - 18;
    ctx.font = F(13);
    let at = padX + ctx.measureText(run).width + 18;
    ctx.font = F(11);
    if (VIEW.sample){
      const note = VIEW_WORDS.sampleLine(VIEW.sample_kind);
      ctx.fillStyle = ACCHI;
      ctx.fillText(note, at, 34);
      at += ctx.measureText(note).width + 18;
    }
    // what the picture compares, and what it does not show
    if (at + ctx.measureText(VIEW_WORDS.header).width <= stop){
      ctx.fillStyle = INK2;
      ctx.fillText(VIEW_WORDS.header, at, 34);
    } else headerBelow = true;
  }
  label(VIEW_WORDS.clockLabel, W-padX, compact?14:17, 'right', INK2);
  num(clockAt(Math.min(p, tree.total)), W-padX, compact?30:38, compact?18:28, 'right', playing?INK:INK2);

  // the four counters the design fixes, for the branch the selected decision stands on, at the
  // moment on screen. Every one of them is a number the campaign's impact engine wrote.
  const n = tree.nodes[sel] || tree.nodes[0];
  const shown = counterText(n);
  const cy = TOP + (compact?16:22);
  // The finding this run produced, in plain English, across the top of the frame, above every
  // graph on the page and above the readout column that stands under it.
  const wideFrame = !compact && W >= PANEL_FROM;
  if (!compact) drawStory(padX + COLUMN + 30, cy, W - padX);
  else { storyBox = null; storyDrawn = null; receiptBox = null; receiptDrawn = null; }
  // the whole detail of the step a viewer picked, in its own column under the story
  if (wideFrame) {
    drawPanel(W - padX - PANEL, (storyBox ? storyBox.y1 : cy) + 30, W - padX, n);
  } else { panelBox = null; panelDrawn = null; }
  label(VIEW_WORDS.counterNames[0], padX, cy, 'left', INK2);
  num(shown[0], padX, cy+22, 18, 'left', ACCHI);
  drawSpark(padX, cy+30, compact?76:104, compact?18:26);
  countersBox = compact ? null : {x0: padX - 4, y0: cy - 14, x1: padX + COLUMN, y1: cy + 60};

  if (!compact && (H - BOT) > (TOP + 216)){
    const y2 = cy + 70;
    label(VIEW_WORDS.counterNames[1], padX, y2, 'left', INK2);
    num(shown[1], padX, y2+20, 18, 'left', INK);
    const y3 = y2 + 40;
    label(VIEW_WORDS.counterNames[2], padX, y3, 'left', INK2);
    num(shown[2], padX, y3+20, 18, 'left', INK);
    const y4 = y3 + 40;
    label(VIEW_WORDS.counterNames[3], padX, y4, 'left', INK2);
    num(shown[3], padX, y4+20, 18, 'left', INK);
    countersBox = {x0: padX - 4, y0: cy - 14, x1: padX + COLUMN, y1: y4 + 26};

    // METHOD — how the decision path on the selected branch worked, under the four counters and
    // inside its own column. With nothing selected this is the control's own sentence.
    ctx.font = F(11);
    const colW = Math.max.apply(null, VIEW_WORDS.counterNames.map(
      (one) => ctx.measureText(one.toUpperCase()).width + 0.88*one.length));
    const size = VIEW_WORDS.methodReading;
    // one sentence broken across that column on whole words, so no line is ever cut mid-word
    const broken = (text) => {
      ctx.font = F(size);
      const lines = [];
      let line = '';
      for (const word of String(text || '').split(' ')){
        const next = line ? line + ' ' + word : word;
        if (line && ctx.measureText(next).width > colW){ lines.push(line); line = word; }
        else line = next;
      }
      if (line) lines.push(line);
      return lines;
    };
    const branch = (n.branch >= 0) ? tree.branches[n.branch] : null;
    const id = (branch && branch.method_id) ? branch.method_id : VIEW.method_order[0];
    // the words above are the first campaign's own; a campaign that names its methods elsewhere
    // has its sentence for each of them in its own story block, and the page reads it from there
    /**
     * Where that sentence is already on screen, this column does not paint it a second time.
     *
     * A campaign that names its methods elsewhere writes one sentence for each of them and none
     * apart for this column, so the sentence this column would paint is the very sentence the
     * story paints under that method's own name. In a frame wide enough to carry those four
     * columns the sentence is already standing there, and this column paints its heading alone
     * and gives the room back to the key. In a narrow frame the columns stand behind the details
     * control, so this column is the only place the sentence stands at rest and it is painted
     * here. The first campaign has its own sentence for this column and is untouched.
     */
    const columnsSayIt = showingGrowth && W > VIEW_WORDS.reading.narrowTo;
    const noteFor = (one) => {
      if (columnsSayIt) return '';
      const row = VIEW.outcome_story.methods.find((held) => held.method_id === one);
      return VIEW_WORDS.methodNote[one] || (row && row.sentence)
        || VIEW_WORDS.methodNote[VIEW.method_order[0]] || '';
    };
    const note = noteFor(id);
    /**
     * How much room the column gives back, so the key never ends behind the controls.
     *
     * The column is measured for the longest sentence any of this campaign's methods can show,
     * not for the one on screen, so nothing in it moves as a reader steps from one method to the
     * next. Where that column would end deeper than the controls may stand, the room comes back
     * in one order — the gap over the sentence, then the sentence's own line step, then the
     * key's — each only as far as its floor and only by as much as is missing. In a frame with
     * room to spare nothing is given back and the column stands exactly as it did.
     */
    const headLines = headerBelow ? broken(VIEW_WORDS.header).length : 0;
    const mostLines = Math.max.apply(null,
      VIEW.method_order.map((one) => broken(noteFor(one)).length));
    const keyLines = 1 + AGENT_WORK.classes.filter((one) => one.id !== 'incident').length
      + AGENT_WORK.edge_kinds.length;
    // the deepest the key may end: the controls stand under it, and the timeline under them
    const deepest = H - BOT - 26 - (tp.offsetHeight || CONTROL_TALL) - 14 - CONTROL_ROOM;
    let gap = COUNTER_ROOM, step = size + 5, keyStep = (W >= PANEL_FROM) ? 18 : 16;
    const takes = () => y4 + gap + (headLines ? headLines*step + 14 : 0)
      + 20 + mostLines*step + 22 + keyStep*keyLines + 6;
    let over = takes() - deepest;
    if (over > 0){
      const give = Math.min(over, COUNTER_ROOM - COUNTER_TIGHT);
      gap -= give; over -= give;
    }
    if (over > 0 && (mostLines + headLines) > 0){
      const give = Math.min(Math.ceil(over/(mostLines + headLines)), (size + 5) - READING_TIGHT);
      step -= give; over -= give*(mostLines + headLines);
    }
    if (over > 0){
      keyStep -= Math.min(Math.ceil(over/keyLines), keyStep - KEY_TIGHT);
    }
    const write = (text, top) => {
      const lines = broken(text);
      ctx.fillStyle = INK2;
      lines.forEach((one, i) => ctx.fillText(one, padX, top + i*step));
      return lines;
    };
    let top = y4 + gap;
    // where the sample line owns the slot in the head of the frame, the header sentence reads here
    if (headerBelow) top += write(VIEW_WORDS.header, top).length*step + 14;
    label(VIEW_WORDS.methodHeading, padX, top, 'left', INK2);
    const said = write(note, top + 20);
    // one handle, so a gate can read the boundary the page is drawing and how big it is drawn
    tree.boundary = {
      header: VIEW_WORDS.header, headerInHead: !headerBelow,
      heading: String(VIEW_WORDS.methodHeading).toUpperCase(),
      methodId: id, sentence: note, lines: said, size: size, color: INK2, width: Math.round(colW),
    };
    // the reading that decodes every colour and shape in the picture, under the counters and the
    // method sentence, at the edge of the frame, at all times
    drawKey(padX, top + 20 + said.length*step + 22, keyStep);
  } else {
    keyBox = null;
    keyDrawn = [];
  }

  // The controls stand at the foot of that same column, under the key, rather than in the band.
  // The band under the picture then keeps its whole width for the sentences a reader came for,
  // and nothing it says has to stop short of a button.
  //
  // They stand under the key at the same room whatever the key does, because the column above has
  // already been measured to leave them that room. The second reading is the last guard: however
  // deep the key ends, the controls never reach the timeline.
  if (!compact && keyBox){
    const wantTop = Math.round(Math.min(keyBox.y1 + CONTROL_ROOM,
      H - BOT - 26 - (tp.offsetHeight || CONTROL_TALL) - 14));
    if (tp.dataset.at !== String(wantTop)){
      tp.dataset.at = String(wantTop);
      tp.style.bottom = 'auto';
      tp.style.top = wantTop + 'px';
    }
    controlBox = {x0: padX - 4, y0: wantTop - 4,
      x1: padX + tp.offsetWidth + 4, y1: wantTop + tp.offsetHeight + 4};
  } else if (tp.dataset.at){
    delete tp.dataset.at;
    tp.style.top = 'auto';
    tp.style.bottom = (compact ? 8 : 10) + 'px';
    controlBox = null;
  }

  drawNodeMarks(t);
  drawTimeline(padX);

  if (!compact) drawReadout(padX, n);

  drawGrain();
}

/**
 * One run of words broken between whole words into the room it has, and never mid-word.
 *
 * The same sentences are laid out on every frame, so each answer is kept under the words, the room
 * and the size that produced it. Nothing about the answer depends on anything else.
 */
const wrapped = new Map();
function wrapInto(said, room, size){
  const key = size + '|' + Math.round(room) + '|' + said;
  const held = wrapped.get(key);
  if (held) return held;
  ctx.font = F(size);
  const rows = [];
  let row = '';
  for (const word of String(said || '').split(' ')){
    const next = row ? row + ' ' + word : word;
    if (row && ctx.measureText(next).width > room){ rows.push(row); row = word; }
    else row = next;
  }
  if (row) rows.push(row);
  if (wrapped.size > 400) wrapped.clear();
  wrapped.set(key, rows);
  return rows;
}

/**
 * One shape, drawn at a point, in the colour of the kind of step it stands for.
 *
 * Colour never acts alone on this page. Every kind of agent step carries its own small shape as
 * well, over its gem in the picture and beside its line in the key, so a reader who cannot tell
 * the hues apart still reads the picture, and so does a grayscale print of it.
 */
function glyph(kind, x, y, r, col){
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
  ctx.beginPath();
  if (kind === 'circle'){ ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke(); }
  else if (kind === 'ring'){
    ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r*0.42, 0, Math.PI*2); ctx.stroke();
  }
  else if (kind === 'dot'){ ctx.arc(x, y, r*0.82, 0, Math.PI*2); ctx.fill(); }
  // the ring the picture draws around an agent a decision called in, standing on its own where
  // the key names it, so the key and the picture never show a reader two different marks
  else if (kind === 'halo'){
    ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r*0.22, 0, Math.PI*2); ctx.fill();
  }
  else if (kind === 'square'){ ctx.strokeRect(x-r+0.5, y-r+0.5, r*2-1, r*2-1); }
  else if (kind === 'hexagon'){
    for (let i=0;i<6;i++){
      const a = Math.PI/6 + i*Math.PI/3;
      const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
  }
  else if (kind === 'diamond'){
    ctx.moveTo(x, y-r); ctx.lineTo(x+r, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r, y);
    ctx.closePath(); ctx.stroke();
  }
  else if (kind === 'triangle'){
    ctx.moveTo(x, y-r); ctx.lineTo(x+r, y+r*0.8); ctx.lineTo(x-r, y+r*0.8);
    ctx.closePath(); ctx.stroke();
  }
  else if (kind === 'cross'){
    ctx.moveTo(x-r, y-r); ctx.lineTo(x+r, y+r);
    ctx.moveTo(x+r, y-r); ctx.lineTo(x-r, y+r);
    ctx.stroke();
  }
  else if (kind === 'bar'){ ctx.fillRect(x-r, y-2, r*2, 4); }
  else if (kind === 'slashbar'){
    ctx.fillRect(x-r, y-2, r*2, 4);
    ctx.beginPath(); ctx.moveTo(x+r*0.7, y-r); ctx.lineTo(x-r*0.7, y+r); ctx.stroke();
  }
  else { ctx.moveTo(x-r, y); ctx.lineTo(x+r, y); ctx.moveTo(x, y-r); ctx.lineTo(x, y+r);
    ctx.stroke(); }
}

/**
 * The key, at the edge of the frame, at all times, in both frames.
 *
 * One line for each kind of agent step the accepted run records, in the auditor's own words,
 * colours and shapes, with how many of that kind stand in the decision now open; then one line for
 * each of the two kinds of line between them. A viewer never has to remember what a colour meant,
 * and a kind that is not in the open decision still holds its place, so the key never changes
 * shape under a reader.
 *
 * The column hands in the step between its lines. It is 18 pixels in a wide frame and 16 in a
 * narrow one, and closer than that only where a short frame has no other room to give, so that
 * the key still ends above the controls.
 */
function drawKey(padX, y, step){
  const counts = {};
  for (const one of tree.nodes) if (one.cls) counts[one.cls] = (counts[one.cls] || 0) + 1;
  // an agent called in stands under two lines of the key: the shape of the work it did, and the
  // ring that says it was called in. Neither replaces the other, so it is counted under both.
  if (CALLED_IN){
    for (const one of tree.nodes){
      if (one.added) counts[CALLED_IN.id] = (counts[CALLED_IN.id] || 0) + 1;
    }
  }
  label(VIEW_WORDS.keyName, padX, y, 'left', INK2);
  let at = y + step;
  keyDrawn = [];
  for (const one of AGENT_WORK.classes){
    if (one.id === 'incident') continue;
    const held = counts[one.id] || 0;
    glyph(one.glyph, padX + 5, at - 4, 5, held ? one.live : one.done);
    label(one.key, padX + 18, at, 'left', held ? INK : INK3);
    num(held, padX + COLUMN - 54, at, 11, 'right', held ? INK2 : INK3);
    keyDrawn.push({id: one.id, key: one.key, glyph: one.glyph, count: held, y: at, size: 11});
    at += step;
  }
  at += 6;
  for (const one of AGENT_WORK.edge_kinds){
    ctx.strokeStyle = one.color; ctx.lineWidth = one.id === 'carry' ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(padX, at - 4.5); ctx.lineTo(padX + 9, at - 4.5); ctx.stroke();
    ctx.lineWidth = 1;
    label(one.key, padX + 16, at, 'left', INK3);
    keyDrawn.push({id: one.id, key: one.key, glyph: 'line', count: null, y: at, size: 11});
    at += step;
  }
  // the box the key stands in, so nothing else the page draws is ever written across it
  keyBox = {x0: padX - 4, y0: y - 12, x1: padX + COLUMN, y1: at};
}
/** where the key stands, and what it drew, once it has been drawn */
let keyBox = null, keyDrawn = [];

/**
 * The accepted receipt run, in one short strip in the right column.
 *
 * A separate accepted run, on its own model, is read here beside the two campaigns: how many
 * handoffs delivered the exact responsibility asked for, how many were admitted on the first
 * try, how many corrections were used, and what happened where a case had an empty receipt. The
 * replication of the same run on a second model stands under it, and reads as pending until
 * there is one. Every word is one of the six slots in the words above and every number is read
 * from the run's own file: the result line and the safety line are templates whose braces are
 * filled here, and the model's name and the hash of its analysis are never painted.
 */
function drawReceipt(x0, y, x1, size){
  receiptBox = null;
  receiptDrawn = null;
  const strip = RECEIPT && RECEIPT.strip;
  const first = strip && strip.first_model;
  if (!first) return y;
  const again = strip.replication || null;
  const room = x1 - x0;
  const step = size + 4;
  const rows = [];
  let at = y;
  // one heading, in the same small capitals every heading beside the picture is written in
  const heading = (said) => {
    label(said, x0, at, 'left', INK2);
    rows.push({slot: said, text: String(said).toUpperCase(), size: 11, rows: [String(said)
      .toUpperCase()]});
    at += size + 6;
  };
  // one line, broken between whole words into the column it has, and never mid-word
  const line = (slot, said, col) => {
    const broken = wrapInto(said, room, size);
    ctx.font = F(size); ctx.fillStyle = col;
    for (const one of broken){ ctx.fillText(one, x0, at); at += step; }
    rows.push({slot: slot, text: said, size: size, rows: broken.slice()});
  };
  // the braces the words above carry, filled from both accepted result blocks
  const values = {
    first_delivered: first.exact_responsibilities_delivered,
    first_total: first.handoffs_total,
    first_try: first.admitted_first_try,
    first_safe: first.safe_open_cases,
    first_cases: first.empty_receipt_cases,
    again_delivered: again && again.exact_responsibilities_delivered,
    again_total: again && again.handoffs_total,
    again_first_try: again && again.admitted_first_try,
    again_safe: again && again.safe_open_cases,
    again_cases: again && again.empty_receipt_cases,
    false_total: first.false_resolutions + (again ? again.false_resolutions : 0),
  };
  const fill = (said) => String(said).replace(/\{(\w+)\}/g, (whole, name) => {
    const value = values[name];
    return (value === null || value === undefined) ? VIEW_WORDS.none : String(value);
  });
  heading(VIEW_WORDS.receipt_heading);
  // A pending replication keeps the first-model result and the waiting status. Once accepted, the
  // two model results share one sentence and the two safety readings share the next.
  const pending = !again || again.status === 'pending';
  if (pending) {
    line(VIEW_WORDS.receipt_pending_result, fill(VIEW_WORDS.receipt_pending_result), INK);
    line(VIEW_WORDS.replication_status, VIEW_WORDS.replication_status, INK3);
  }
  else {
    line(VIEW_WORDS.receipt_result, fill(VIEW_WORDS.receipt_result), INK);
    line(VIEW_WORDS.receipt_safety, fill(VIEW_WORDS.receipt_safety), INK2);
  }
  at += 6;
  line(VIEW_WORDS.evidence_boundary, VIEW_WORDS.evidence_boundary, INK3);
  const bottom = at - step + 6;
  receiptBox = {x0: x0 - 8, y0: y - 13, x1: x1, y1: bottom};
  receiptDrawn = {rows: rows, size: size, box: receiptBox, pending: pending,
    numbers: {first_model: first, replication: again}};
  return bottom;
}
/** where the receipt strip stands, and what it painted, once it has been drawn */
let receiptBox = null, receiptDrawn = null;

/**
 * The outcome story: what this run found, in plain English, before any picture is read.
 *
 * The paragraph is the auditor's, with every number read off the run by the bake and none of them
 * typed. Under it stands one column per method: its name and the one sentence saying why it landed
 * where the paragraph says it did, or, where a viewer has opened the details, the exact readings
 * across the eight seeds instead. Choosing a column chooses that method's trajectory, so every
 * picture on the page answers one sentence a reader has just read. The limits stand under them
 * all, in one short block.
 *
 * In a frame 1280 wide or narrower those four columns would leave the picture a strip too thin to
 * read as a picture, so they stand behind the details control there: nothing of them is drawn
 * until a reader opens the details, and then all four sentences are written out in full, in the
 * words that say why each method landed where it did. The paragraph, the limits and the line
 * under them stay on screen in every frame.
 */
function drawStory(x0, y, x1){
  const story = VIEW.outcome_story;
  storyDrawn = null;
  storyPicks = [];
  receiptBox = null;
  receiptDrawn = null;
  if (!story || x1 - x0 < 300){ storyBox = null; return; }
  // every word of the story is reading text, so all of it stands at the size the contract fixes
  const read = (W >= VIEW_WORDS.reading.wideFrom)
    ? VIEW_WORDS.reading.large : VIEW_WORDS.reading.small;
  const small = read;
  const room = x1 - x0;
  // the paragraph, and the limits directly beside it, so what this is and what it is not are read
  // in the same breath
  const limitFrom = x0 + Math.round(room * 0.70);
  label(VIEW_WORDS.storyHeading, x0, y, 'left', INK2);
  // what this page is, on the heading's own line, before the finding it carries
  ctx.font = F(11);
  const headingWide = ctx.measureText(String(VIEW_WORDS.storyHeading).toUpperCase()).width
    + 0.88*String(VIEW_WORDS.storyHeading).length + 20;
  const subtitleRows = wrapInto(VIEW_WORDS.subtitle, room - headingWide, 11);
  ctx.font = F(11); ctx.fillStyle = INK3;
  let subtitleAt = y;
  for (const one of subtitleRows){ ctx.fillText(one, x0 + headingWide, subtitleAt); subtitleAt += 15; }
  let at = Math.max(y + read + 6, subtitleAt + 4);
  // the finding, and the limits directly beside it, so what this is and what it is not are read
  // in the same breath
  const bodyTop = at;
  label(VIEW_WORDS.limitsHeading, limitFrom, bodyTop, 'left', INK3);
  /**
   * The finding, holding nothing the page writes out again lower down.
   *
   * A campaign that writes its finding as separate sentences has one sentence for each method,
   * which stands under that method's own name, and a last sentence, which stands as the
   * conclusion under them all. Both are dropped here, so a reader is given each sentence once
   * and the paragraph is the two sentences nothing else says: what the run found, and what it
   * came to across every seed. A campaign that writes only the whole paragraph keeps it word for
   * word.
   */
  const elsewhere = new Set();
  if (showingGrowth && story.sentences && story.sentences.length > 1){
    for (const one of story.methods) if (one.sentence) elsewhere.add(one.sentence);
    elsewhere.add(story.sentences[story.sentences.length - 1]);
  }
  const kept = elsewhere.size ? story.sentences.filter((one) => !elsewhere.has(one)) : [];
  const finding = kept.length ? kept.join(' ') : story.paragraph;
  const paragraph = wrapInto(finding, limitFrom - x0 - 30, read);
  ctx.font = F(read); ctx.fillStyle = INK;
  for (const one of paragraph){ ctx.fillText(one, x0, at); at += read + 4; }
  // Directly under the finding, where the campaign on screen recorded extra agents being called
  // in: how many of this run's decisions called for them, how many were called in, and what share
  // of the run's model time those calls took. The campaign writes the sentence; the page reads it.
  const grown = (tree.growth && tree.growth.sentence) ? tree.growth.sentence : '';
  const grownRows = grown ? wrapInto(grown, limitFrom - x0 - 30, read) : [];
  if (grownRows.length){
    at += 4;
    ctx.font = F(read); ctx.fillStyle = INK2;
    for (const one of grownRows){ ctx.fillText(one, x0, at); at += read + 4; }
  }
  let limitAt = bodyTop + read + 6;
  const limitRows = [];
  ctx.fillStyle = INK3;
  for (const one of story.limits){
    for (const row of wrapInto(one, x1 - limitFrom, read)){
      ctx.font = F(read);
      ctx.fillText(row, limitFrom, limitAt);
      limitRows.push(row);
      limitAt += read + 4;
    }
    limitAt += 4;
  }
  const limitBox = {x0: limitFrom - 8, y0: bodyTop - 13, x1: x1, y1: limitAt - read};
  at = Math.max(at, limitAt) + 10;

  const here = (tree.nodes[sel] && tree.nodes[sel].branch >= 0
    && tree.branches[tree.nodes[sel].branch]) ? tree.branches[tree.nodes[sel].branch].method_id : null;
  const shownMethods = AGENT_WORK.method_order;
  const gap = 18;
  const columnsTo = x1;
  // where the frame is narrow the four columns are drawn only once a reader opens the details,
  // and the sentence each one carries there is the plain one saying why that method landed where
  // it did, which is the sentence a wide frame keeps on screen at all times
  const narrow = W <= VIEW_WORDS.reading.narrowTo;
  const painted = !narrow || storyDetails;
  /**
   * The accepted receipt run, in the right column, directly under the limits.
   *
   * It is a separate accepted run, so it stands beside both campaigns and says nothing about
   * either one. In a wide frame it is on the canvas at all times, in the column the limits stand
   * in, and the four method sentences give it the width it needs. In a frame 1280 wide or
   * narrower there is no room for it at rest: painting it there pushes the picture under the 220
   * pixels the contract fixes for it, so there it stands behind the details control, with the
   * four method sentences, and comes on screen with them.
   */
  const receiptOn = painted;
  const receiptFrom = receiptOn ? x1 - RECEIPT_COLUMN : x1;
  // the strip is a compact reading rather than prose, so it is written at the smaller of the two
  // reading sizes in both frames, which is the floor the contract fixes and never under it
  const receiptBottom = receiptOn
    ? drawReceipt(receiptFrom, limitAt + 8, x1, VIEW_WORDS.reading.small) : limitAt;
  // the four sentences give up the width the strip takes, so nothing is drawn behind it
  const methodsTo = receiptOn ? Math.min(columnsTo, receiptFrom - 30) : columnsTo;
  const each = (methodsTo - x0 - gap*(shownMethods.length - 1)) / shownMethods.length;
  let deepest = at;
  const said = [];
  shownMethods.forEach((id, i) => {
    const cx = x0 + i*(each + gap);
    const row = story.methods.find(one => one.method_id === id) || {label: id};
    const on = here === id;
    const sentence = (storyDetails && !narrow)
      ? (story.details[story.methods.indexOf(row)] || '')
      // the four sentences above are the first campaign's own; a campaign that names its methods
      // elsewhere carries a sentence for each of them in its own story block
      : (VIEW_WORDS.why[id] || row.sentence || '');
    if (!painted){
      said.push({method: id, name: row.label, sentence: sentence, size: small, open: on,
        painted: false, rows: [], box: null});
      return;
    }
    label(row.label, cx, at, 'left', on ? ACCHI : INK2);
    ctx.fillStyle = on ? INK : INK2;
    let line = at + small + 6;
    const rows = wrapInto(sentence, each, small);
    for (const one of rows){
      ctx.fillText(one, cx, line);
      line += small + 4;
    }
    deepest = Math.max(deepest, line);
    said.push({method: id, name: row.label, sentence: sentence, size: small, open: on,
      painted: true, rows: rows,
      box: {x0: cx - 6, y0: at - 13, x1: cx + each, y1: line - small}});
  });
  storyPicks = said.filter(one => one.painted).map(one => ({method: one.method, box: one.box}));

  // the bottom line, under all four of them: what this run is really about. It is written only
  // where the bake has proved both readings behind it, and the true counts stand in where not.
  const proved = story.handoff && story.handoff.every_chain_failed_it
    && story.handoff.capacity_or_double_booking_breaks === 0;
  // A campaign that ends its own finding on a conclusion carries that sentence last in its story
  // block, and the page paints that one instead of the sentence written above for the first
  // campaign. It is the campaign's own last word, not a reading, so no count stands in for it.
  const closed = showingGrowth && story.sentences && story.sentences.length
    ? story.sentences[story.sentences.length - 1] : '';
  const bottom = closed || (proved ? VIEW_WORDS.bottomLine
    : VIEW_WORDS.bottomLineCount(story.handoff ? story.handoff.chains_that_failed_it : 0,
      story.handoff ? story.handoff.chains : 0,
      story.handoff ? story.handoff.capacity_or_double_booking_breaks : 0));
  // the conclusion stands under the strip as well as under the four sentences, so neither the
  // strip nor a sentence is ever written across it
  deepest = Math.max(deepest, receiptBottom);
  const sentencesBottom = deepest;
  let bottomAt = deepest + 12;
  const bottomTop = bottomAt - small + 2;
  const bottomRows = wrapInto(bottom, columnsTo - x0, read);
  ctx.font = F(read); ctx.fillStyle = INK;
  for (const one of bottomRows){ ctx.fillText(one, x0, bottomAt); bottomAt += read + 4; }
  // the readings that ground that sentence, where a viewer has opened the details behind the story
  const grounds = (storyDetails && story.handoff && story.handoff.detail)
    ? wrapInto(story.handoff.detail, columnsTo - x0, read) : [];
  if (grounds.length){
    bottomAt += 4;
    ctx.fillStyle = INK2;
    for (const one of grounds){ ctx.fillText(one, x0, bottomAt); bottomAt += read + 4; }
  }
  deepest = bottomAt;

  // The story stands in two rows of the frame: the finding and its limits, which keep clear of
  // the readout column beside them, and the four sentences under them, which run the whole width
  // where that column has already ended above them. Both are kept, so nothing is drawn behind
  // either, and the one box below is the room they take together.
  const topBox = {x0: x0 - 8, y0: y - 14, x1: x1, y1: at - small - 4};
  const columnsBox = {x0: x0 - 8, y0: at - small - 2, x1: columnsTo,
    y1: sentencesBottom - small + 6};
  storyBox = {x0: x0 - 8, y0: y - 14, x1: Math.max(x1, columnsTo), y1: deepest - small + 6};
  storyDrawn = {heading: String(VIEW_WORDS.storyHeading).toUpperCase(),
    subtitle: VIEW_WORDS.subtitle, subtitleRows: subtitleRows, top: topBox, columns: columnsBox,
    paragraph: finding, rows: paragraph, size: read, methods: said,
    growth: grown, growthRows: grownRows,
    limitsHeading: String(VIEW_WORDS.limitsHeading).toUpperCase(),
    limits: story.limits.slice(), limitRows: limitRows, limitSize: read,
    limitBox: limitBox, details: storyDetails, box: storyBox,
    bottomLine: bottom, bottomRows: bottomRows, bottomProved: proved, grounds: grounds,
    bottomBox: {x0: x0 - 8, y0: bottomTop, x1: columnsTo, y1: bottomAt - read + 4}};
}
/** where the story stands, what it said, and which of its sentences can be chosen */
let storyBox = null, storyDrawn = null, storyPicks = [];
/** where the counters stand, so nothing is ever written across them either */
let countersBox = null;
/** where the controls stand, once they have been placed at the foot of the left column */
let controlBox = null;

/**
 * The whole detail of the step a viewer picked, in its own column, where the frame is wide.
 *
 * A decision reads as the impact design fixes it: where it stands in the seventy-two hours, the
 * proposal itself, what the admission gate did with it, and what that one moment served and
 * wasted. The cumulative readings belong to the band under the picture and are not repeated here.
 * One agent step inside a decision reads as the dense-network contract fixes it: the decision and
 * its deadline, what this scout, reviewer, coordinator or checker actually said or did, which
 * kind of step it is and its place in the method, whether the modeled state changed, and the
 * modeled change at that one moment.
 */
function drawPanel(x0, y, x1, n){
  const room = x1 - x0;
  // the column stops short of the line under the picture
  const floor = H - BOT - 26;
  const home = n.cls ? tree.nodes[n.home] : n;
  const lines = panelLines(n, home).filter(one => one.text);
  // No line of the opened decision is ever dropped from this column. Where its lines do not fit,
  // the column is read one step smaller, and never under sixteen pixels; where that is still not
  // enough it takes the free canvas above it, under the conclusion paragraph; and where even that
  // is not enough its longest line simply breaks into the rows it needs and the column stands as
  // tall as they make it.
  const tall = (size) => lines.reduce(
    (held, one) => held + wrapInto(one.text, room, size).length*(size + 4) + 4, 0);
  const under = (size, at) => at + 44 + tall(size) - 4 - floor;
  let read = VIEW_WORDS.reading.large;
  let top = y;
  while (read > VIEW_WORDS.reading.small && under(read, top) > 0) read -= 1;
  // the free canvas is what stands between the conclusion paragraph and the head of the column
  if (storyBox && under(read, top) > 0){
    top = Math.max(storyBox.y1 + 16, top - under(read, top));
  }
  const step = read + 4;
  label(VIEW_WORDS.panelHeading, x0, top, 'left', INK2);
  ctx.font = F(11); ctx.fillStyle = INK3;
  const branch = (home.branch >= 0) ? tree.branches[home.branch] : null;
  ctx.fillText(VIEW_WORDS.panelRun(tree.seed, branch ? branch.label : ''), x0, top + 18);
  let at = top + 44;
  const drawn = [];
  for (const one of lines){
    const rows = wrapInto(one.text, room, read);
    ctx.fillStyle = one.color;
    for (const row of rows){
      ctx.font = F(read);
      ctx.fillText(row, x0, at);
      at += step;
    }
    // the rows it was broken into, so a gate can read back what the column actually painted
    drawn.push({text: one.text, size: read, color: one.color, rows: rows.slice()});
    at += 4;
  }
  panelBox = {x0: x0 - 10, y0: top - 14, x1: x1, y1: at};
  panelDrawn = {heading: String(VIEW_WORDS.panelHeading).toUpperCase(), lines: drawn,
    size: read, kind: n.cls || 'decision', box: panelBox};
}
/** where the readout column stands, and what it said, once it has been drawn */
let panelBox = null, panelDrawn = null;

/** the ordered contents of one readout, for a decision or for one agent step inside it */
function panelLines(n, home){
  const s = states[sel] || 'pending';
  if (n.incident || (!n.cls && !n.counters)){
    return [{text: n.action, color: INK}, {text: n.sentence, color: INK2}];
  }
  const situation = VIEW_WORDS.situation(
    clockAt(home.res), VIEW_WORDS.hours(home.hours || 0), VIEW.incident.hours);
  if (n.cls){
    const hue = GLYPH[n.cls] || {live: INK};
    return [
      {text: situation, color: INK2},
      {text: n.readout[0] || n.action, color: s === 'pending' ? INK3 : hue.live},
      {text: n.readout[1] || '', color: INK2},
      {text: home.sentence, color: home.admitted === false ? BAD : INK},
      {text: home.counters
        ? VIEW_WORDS.moment(home.servedNames[0], home.servedCount - 1, home.waste) : '',
      color: INK2},
    ];
  }
  // the four lines the opened decision is read by. The cumulative readings and the projection are
  // not among them: the band under the picture always carries those, and the column never says a
  // second time what the band is already saying.
  return [
    {text: situation, color: INK2},
    // the column carries the count of the further assignments, because the band no longer does
    {text: n.more ? n.action + '  ' + VIEW_WORDS.more(n.more) : n.action, color: INK},
    {text: n.sentence, color: n.admitted === false ? BAD : INK},
    {text: n.counters ? VIEW_WORDS.moment(n.servedNames[0], n.servedCount - 1, n.waste) : '',
      color: INK2},
  ];
}

/**
 * Choosing one of the story's method sentences chooses that method's trajectory.
 *
 * The story comes first and every picture on the page answers one of its sentences, so a reader
 * who wants the evidence for a sentence points at the sentence itself. Nothing is created,
 * sampled or graded: the same recorded trajectory is simply the one now selected.
 */
function pickStory(e){
  if (!storyPicks.length || onButton(e.target)) return;
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  for (const one of storyPicks){
    if (x < one.box.x0 || x > one.box.x1 || y < one.box.y0 || y > one.box.y1) continue;
    const branch = tree.branches.findIndex(held => held.method_id === one.method);
    if (branch < 0) return;
    const at = tree.nodes.findIndex(held => held.branch === branch && !held.cls);
    if (at < 0) return;
    sel = at;
    userPicked = true;
    return;
  }
}

/** the four readings of one node, each written the way its own counter is read */
function counterText(node){
  const fields = VIEW.counter_fields;
  // the counters belong to the decision, so opening one of its agent steps never displaces them
  const at = (node && node.cls) ? tree.nodes[node.home] : node;
  const held = at && at.counters;
  const say = [VIEW_WORDS.hours, VIEW_WORDS.share, VIEW_WORDS.whole, VIEW_WORDS.whole];
  return fields.map((field, i) => {
    const value = held ? held[field] : null;
    return (value === null || value === undefined) ? VIEW_WORDS.none : say[i](value);
  });
}

/**
 * One line of the readout, right against the edge of the frame.
 *
 * Nothing is ever cut and nothing is ever fine print. Reading text is 18 pixels in a wide frame
 * and 16 in a narrow one; a line too long for its room is written at 16 first, and only where
 * even that will not hold does it drop a whole sentence from its end. A reader is never left
 * holding half a thought.
 */
function say(bits, y, room, col){
  const kept = bits.filter(Boolean);
  if (!kept.length) return 0;
  // the rows of one line stand this far apart, the same distance the band's own lines stand apart
  const step = 19;
  const read = VIEW_WORDS.reading;
  let size = read.large;
  ctx.font = F(size);
  if (W < read.wideFrom && ctx.measureText(kept.join('  ')).width > room){
    size = read.small;
    ctx.font = F(size);
  }
  while (kept.length > 1 && ctx.measureText(kept.join('  ')).width > room) kept.pop();
  const said = kept.join('  ');
  // One sentence a method recorded can be longer than the frame is wide. It is one thought and
  // one quotation, so it is never cut and never shrunk under reading size: it is broken between
  // words into as many rows as it needs, and those rows stack upward from where the line sits,
  // so the line's last row always stands exactly where the line belongs.
  const rows = [];
  let row = '';
  for (const word of said.split(' ')){
    const next = row ? row + ' ' + word : word;
    if (row && ctx.measureText(next).width > room){ rows.push(row); row = word; }
    else row = next;
  }
  if (row) rows.push(row);
  ctx.fillStyle = col;
  ctx.textAlign = 'right';
  rows.forEach((one, i) => ctx.fillText(
    one, W - (compact ? 10 : 16), y - (rows.length - 1 - i) * step));
  ctx.textAlign = 'left';
  // one handle, so a gate can read what the band says, how big it says it, and in how many rows
  if (tree && tree.said) tree.said.push({text: said, size: size, color: col, y: y,
    rows: rows.length, parts: rows.slice(),
    over: rows.filter((one) => ctx.measureText(one).width > room).length});
  return rows.length;
}

/**
 * The band under the picture: four lines, in the order a person needs them.
 *
 * The situation this decision stands in, the proposal itself, what the admission gate did with it
 * beside what that one moment served and wasted, and the four cumulative readings with the
 * projection to the close of the seventy-two hours. The proposal and the verdict are the two the
 * eye goes to, so they are the two written in the brighter ink.
 *
 * The last two lines share their row with the controls and stop short of them. The evidence
 * pointer and the count of public reports behind a moment stay in the campaign's own file, where
 * the page keeps them: they are machinery, and this band is for a reader.
 */
function drawReadout(padX, n){
  const s = states[sel] || 'pending';
  const room = W - padX*2;
  // the controls stand in the left column now, so the band keeps its whole width for its words
  const rail = controlBox ? room : (W - padX) - (tp.offsetLeft + tp.offsetWidth + 14);
  tree.said = [];

  // One agent step inside a decision reads in the order the dense-network contract fixes: the
  // decision and its deadline; what this scout, reviewer, coordinator or checker said or did,
  // beside which kind of step it is and its place in the method; whether the modeled state
  // changed; and what that one moment served and wasted.
  if (n.cls){
    const home = tree.nodes[n.home];
    const hue = GLYPH[n.cls] || {live: INK};
    const proposal = Math.max(1, say([n.readout[0] || n.action, n.readout[1] || ''], H-43, room,
      s === 'pending' ? INK3 : hue.live));
    say([VIEW_WORDS.situation(clockAt(home.res), VIEW_WORDS.hours(home.hours || 0),
      VIEW.incident.hours)], H-43 - proposal*19, room, INK2);
    say([home.sentence], H-24, rail, home.admitted === false ? BAD : INK);
    say([home.counters
      ? VIEW_WORDS.moment(home.servedNames[0], home.servedCount - 1, home.waste) : ''],
    H-5, rail, INK2);
    tree.said.sort((one, two) => one.y - two.y);
    tree.bandTop = H-43 - proposal*19 - 14;
    return;
  }

  // (3) what the admission gate did with it, then what this one moment served and wasted. Both
  // are read here, before anything is drawn, because the column beside the picture may have said
  // them already.
  const became = (s==='pending') ? VIEW_WORDS.waiting
    : (s==='running') ? VIEW_WORDS.showing : n.sentence;
  const moment = n.counters
    ? VIEW_WORDS.moment(n.servedNames[0], n.servedCount - 1, n.waste) : '';
  // Where the readout column stands beside the picture and has said the proposal, what became of
  // it and what the moment served, the band does not say any of them a second time: it keeps the
  // situation and the cumulative readings, and the column carries the count of the further
  // assignments. The column never drops one of those sentences, and where a frame is too narrow
  // for a column at all the band still carries every line, so a reader never loses one.
  const paired = panelBox !== null && panelDrawn
    && [n.action, became, moment].filter(Boolean)
      .every((one) => panelDrawn.lines.some((held) => held.text.startsWith(one)));

  // (2) the proposal itself, in the campaign's own sentence, and how many more it carried. It is
  // written first because a long one takes more than one row and everything above it moves up.
  const proposal = paired ? 0 : Math.max(1,
    say([n.action, n.more ? VIEW_WORDS.more(n.more) : ''], H-43, room, INK));

  // (1) where in the seventy-two hours this decision stands, and what opened in the stretch
  // before it, which the clock and the world did on their own
  const here = [VIEW_WORDS.situation(
    clockAt(n.res), VIEW_WORDS.hours(n.hours || 0), VIEW.incident.hours)];
  if (n.counters){
    here.push((n.first ? VIEW_WORDS.sinceStart : VIEW_WORDS.since)(
      VIEW_WORDS.list(sinceBefore(n))));
  }
  const top = paired ? H-24 : H-43 - proposal*19;
  say(here, top, room, INK2);

  if (!paired) say([became, moment], H-24, rail, s==='running' ? ACCHI : INK);

  // (4) the four cumulative readings the counters carry, then the registered primary outcome
  const fields = VIEW.counter_fields;
  const closing = [];
  if (n.counters){
    closing.push(VIEW_WORDS.sofar(VIEW_WORDS.share(n.counters[fields[1]]),
      n.counters[fields[2]], VIEW_WORDS.hours(n.counters[fields[0]])));
  }
  if (n.projected !== null && n.projected !== undefined){
    closing.push(VIEW_WORDS.projected(VIEW_WORDS.hours(n.projected)));
  }
  say(closing, H-5, rail, INK2);

  // the band reads top to bottom whichever of its lines was written first
  tree.said.sort((one, two) => one.y - two.y);
  // where the top of the band's own writing now is, so the hour numbers under the run stand down
  // for the decisions whose sentence needed the room they stand in
  tree.bandTop = top - 14;
}

/**
 * What changed between one decision and the one before it on the same branch.
 *
 * The clock runs on between two checkpoints and new needs open on their own, so none of this is
 * credited to the action on this node. Every number is the campaign's own reading of the
 * difference between its two checkpoints.
 */
function sinceBefore(n){
  const fields = VIEW.counter_fields;
  const clauses = [VIEW_WORDS.sinceHours(VIEW_WORDS.hours(n.since || 0))];
  const delta = n.delta || {};
  if (delta[fields[0]]) clauses.push(VIEW_WORDS.sinceWaited(VIEW_WORDS.hours(delta[fields[0]])));
  if (delta[fields[2]]) clauses.push(VIEW_WORDS.sinceOpen(delta[fields[2]]));
  if (delta[fields[3]]) clauses.push(VIEW_WORDS.sinceWaste(delta[fields[3]]));
  if (clauses.length === 1) clauses.push(VIEW_WORDS.sinceNothing);
  return clauses;
}

function drawSpark(x,y,w,h){
  hair(x, y+h, x+w, y+h, RULE);
  const n = Math.min(HIST, histN);
  if (n > 1){
    ctx.beginPath();
    for (let i=0;i<n;i++){
      const idx = (histN - n + i + HIST*2) % HIST;
      const v = Math.min(1, hist[idx]/Math.max(1, tree.peak));
      const px = x + (i/(n-1))*w;
      const py = y + h - v*h;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.strokeStyle = ACC; ctx.lineWidth = 1; ctx.stroke();
  }
  const last = hist[(histN-1+HIST)%HIST] || 0;
  const ly = y + h - Math.min(1,last/Math.max(1, tree.peak))*h;
  ctx.fillStyle = ACCHI; ctx.fillRect(x+w-2, Math.round(ly)-1, 3, 3);
}

function drawNodeMarks(t){
  if (!gl_ok) return;
  for (let i=0;i<tree.nodes.length;i++){
    if (states[i] !== 'running') continue;
    const s = scr[i]; if (!s || !s.vis) continue;
    ctx.globalAlpha = 0.45 + 0.45*(0.5 + 0.5*Math.sin(t*3.4 + i));
    cross(s.x, s.y + TOP, 6, ACCHI);
    ctx.globalAlpha = 1;
  }
  for (let i=0;i<tree.nodes.length;i++){
    if (states[i] !== 'pruned') continue;
    const s = scr[i]; if (!s || !s.vis) continue;
    ctx.strokeStyle = BAD; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x-4.5, s.y+TOP-4.5); ctx.lineTo(s.x+4.5, s.y+TOP+4.5);
    ctx.moveTo(s.x+4.5, s.y+TOP-4.5); ctx.lineTo(s.x-4.5, s.y+TOP+4.5);
    ctx.stroke();
  }
  // Every decision of a method keeps its own agent work folded away under one small marker, so a
  // reader can see that the work is there before opening it. The decision now open wears none: its
  // steps stand around it instead.
  tree.clusters = [];
  ctx.globalAlpha = 0.7;
  for (let i=0;i<tree.nodes.length;i++){
    const one = tree.nodes[i];
    if (one.cls || one.branch < 0) continue;
    const branch = tree.branches[one.branch];
    if (!branch || branch.kind !== 'method') continue;
    if (one.branch === openBranch && i === 1 + openBranch*tree.perBranch + openDecision) continue;
    const o = scr[i]; if (!o || !o.vis) continue;
    ctx.fillStyle = INK3;
    for (let k=0;k<3;k++){
      ctx.beginPath();
      ctx.arc(o.x - 5 + k*5, o.y + TOP - 13, 1.4, 0, Math.PI*2);
      ctx.fill();
    }
    tree.clusters.push({id: i, branch: one.branch, x: o.x, y: o.y + TOP});
  }
  ctx.globalAlpha = 1;

  // Every agent step carries its own kind's shape as well as its colour, so a reader who cannot
  // tell the hues apart still reads the open decision, and so does a grayscale print of it.
  tree.drawn = [];
  for (let i=0;i<tree.nodes.length;i++){
    const one = tree.nodes[i];
    if (!one.cls) continue;
    const o = scr[i]; if (!o || !o.vis) continue;
    const kind = GLYPH[one.cls];
    if (!kind) continue;
    const waiting = states[i] === 'pending';
    ctx.globalAlpha = waiting ? 0.45 : 0.92;
    glyph(kind.glyph, o.x, o.y + TOP, 4.5, waiting ? kind.done : kind.live);
    // An agent the decision called in keeps the shape of the work it did and gains one ring, in
    // the colour the campaign gives called-in work. The shape says what it did; the ring says it
    // was not on the team when the decision began.
    const called = one.added ? CALLED_IN : null;
    if (called){
      ctx.strokeStyle = waiting ? called.done : called.live;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(o.x, o.y + TOP, 7.5, 0, Math.PI*2);
      ctx.stroke();
    }
    tree.drawn.push({id: i, cls: kind.id, glyph: kind.glyph,
      color: waiting ? kind.done : kind.live, waiting: waiting,
      ring: called ? (waiting ? called.done : called.live) : null});
  }
  ctx.globalAlpha = 1;
  // a rejected proposal carries a mark as well as a colour, so its state is never colour alone
  for (let i=0;i<tree.nodes.length;i++){
    if (tree.nodes[i].cls !== 'rejected' || states[i] === 'pending') continue;
    const s = scr[i]; if (!s || !s.vis) continue;
    ctx.strokeStyle = BAD; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x-4.5, s.y+TOP-4.5); ctx.lineTo(s.x+4.5, s.y+TOP+4.5);
    ctx.moveTo(s.x+4.5, s.y+TOP-4.5); ctx.lineTo(s.x-4.5, s.y+TOP+4.5);
    ctx.stroke();
  }

  // each branch says which of the five it is, once, at the far end of its own lane, and stands
  // out of the way of whichever decision is open
  const last = {};
  for (let i=0;i<tree.nodes.length;i++){
    if (tree.nodes[i].branch >= 0 && !tree.nodes[i].cls) last[tree.nodes[i].branch] = i;
  }
  const open = scr[sel];
  ctx.font = F(11);
  // where the phrase beside the open decision is about to be written, measured the way the
  // component writes it, so that no branch name is drawn across it
  const openSaid = (open && open.vis) ? roomFor(sel) : '';
  const openW = openSaid ? ctx.measureText(openSaid).width : 0;
  const openX = openSaid
    ? ((open.x + 16 + openW <= W - 8) ? open.x + 16 : open.x - 16 - openW) : 0;
  const openY = openSaid
    ? ((open.y + TOP - 12 < TOP + 14) ? open.y + TOP + 24 : open.y + TOP - 8) : 0;
  const named = [];
  for (const key in last){
    const i = last[key], o = scr[i];
    if (!o || !o.vis || i === sel || i === hover) continue;
    const w = ctx.measureText(tree.nodes[i].label).width;
    const x = o.x + 14, y = o.y + TOP + 4;
    if (openSaid && Math.abs(y - openY) < 15 && x < openX + openW + 10 && x + w > openX - 10){
      continue;
    }
    // one branch name is never written across another, and none is written across the words at
    // the edge of the frame
    const box = {x0: x - 6, y0: y - 12, x1: x + w + 6, y1: y + 4};
    const crossed = [...named, keyBox, storyBox, panelBox, countersBox, controlBox].some((held) => held
      && box.x0 < held.x1 && box.x1 > held.x0 && box.y0 < held.y1 && box.y1 > held.y0);
    if (crossed) continue;
    named.push(box);
    ctx.fillStyle = (tree.nodes[i].branch === (tree.nodes[sel]||{}).branch) ? INK2 : INK3;
    ctx.fillText(tree.nodes[i].label, x, y);
  }
  if (hover >= 0 && hover !== sel && scr[hover] && scr[hover].vis){
    const said = roomFor(hover);
    if (said){
      cross(scr[hover].x, scr[hover].y+TOP, 8, INK);
      tag(said, scr[hover].x, scr[hover].y+TOP, INK2);
    }
  }
  const s = scr[sel];
  if (s && s.vis){
    const x = Math.round(s.x), y = Math.round(s.y)+TOP, r = 11;
    ctx.strokeStyle = ACCHI; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x-r+0.5,y-r+3.5); ctx.lineTo(x-r+0.5,y-r+0.5); ctx.lineTo(x-r+3.5,y-r+0.5);
    ctx.moveTo(x+r-3.5,y-r+0.5); ctx.lineTo(x+r-0.5,y-r+0.5); ctx.lineTo(x+r-0.5,y-r+3.5);
    ctx.moveTo(x+r-0.5,y+r-3.5); ctx.lineTo(x+r-0.5,y+r-0.5); ctx.lineTo(x+r-3.5,y+r-0.5);
    ctx.moveTo(x-r+3.5,y+r-0.5); ctx.lineTo(x-r+0.5,y+r-0.5); ctx.lineTo(x-r+0.5,y+r-3.5);
    ctx.stroke();
    // an agent step's phrase keeps its own kind's colour, so the picture and the key never disagree
    const kind = tree.nodes[sel].cls ? GLYPH[tree.nodes[sel].cls] : null;
    if (openSaid) tag(openSaid, x, y, kind ? kind.live : ACCHI);
  }
}

/**
 * The whole phrase this node can stand beside, or nothing.
 *
 * The campaign writes each action several ways, from the longest form to the shortest, and none
 * of them is ever cut short or ended in a row of dots. This takes the longest form that stands
 * inside the width a phrase beside a node may have and still fits in the frame beside the gem.
 * Where no form does, nothing is written there: the whole action is always readable in the band
 * under the picture, and the bracket around the gem still says which decision is open.
 */
function roomFor(i){
  const o = scr[i], n = tree.nodes[i];
  if (!o || !n) return '';
  ctx.font = F(11);
  // the words beside the picture are never written over: a phrase that would cross the key, the
  // story or the readout column is not the phrase this node stands beside
  const clear = (x0, w) => {
    const y0 = (o.y + TOP - 12 < TOP + 14) ? o.y + TOP + 12 : o.y + TOP - 20;
    const y1 = y0 + 14;
    for (const box of [keyBox, storyBox, panelBox, countersBox, controlBox]){
      if (!box) continue;
      if (x0 < box.x1 && x0 + w > box.x0 && y0 < box.y1 && y1 > box.y0) return false;
    }
    return true;
  };
  for (const said of (n.labels && n.labels.length ? n.labels : [n.tag])){
    if (!said) continue;
    const w = ctx.measureText(said).width;
    if (w > VIEW_WORDS.labelWidth) continue;
    if (o.x + 16 + w <= W - 8 && clear(o.x + 16, w)) return said;
    if (o.x - 16 - w >= 8 && clear(o.x - 16 - w, w)) return said;
  }
  return '';
}

function tag(text, x, y, col){
  ctx.font = F(11);
  const w = ctx.measureText(text).width;
  let tx = x + 16, ty = y - 12;
  const right = (tx + w <= W - 8);
  if (!right) tx = x - 16 - w;
  if (ty < TOP + 14) ty = y + 20;
  hair(x + (right?11:-11), y, tx + (right?-4:w+4), ty+3, RULE2);
  ctx.fillStyle = col; ctx.fillText(text, tx, ty+4);
}

function drawTimeline(padX){
  const x0 = padX + (compact ? ((tp.offsetWidth||90) + 12) : 0);
  const x1 = W - padX;
  // the one approved layout exception: the timeline overlays the bottom edge of the picture, so
  // the band below it is left clear for the action sentence and the controls
  const y  = H - BOT - 26;
  if (x1 - x0 < 60 || !tree.total) return;
  const map = u => x0 + (u/tree.total)*(x1-x0);
  // A decision whose own sentence needs more than one row grows the band under this line into the
  // room the hour numbers stand in. The sentence is what a reader came for, so the numbers stand
  // down for that decision and the hour marks themselves stay.
  const numbered = !(tree.bandTop < y + 18);

  hair(x0, y, x1, y, RULE2);
  const totSec = tree.total * SEC_PER_UNIT;
  for (let s=0; s<=totSec; s++){
    const px = map(s/SEC_PER_UNIT);
    const major = (s % 5 === 0);
    hair(px, y, px, y + (major?6:3), major?RULE2:RULE);
    if (major && s>0 && !compact && numbered) label(s+VIEW_WORDS.tickUnit, px, y+18, 'center', INK3);
  }
  if (!compact && numbered){
    // the marks are hours now, and there are seventy-two of them: the line is named only where
    // its name ends before the first hour mark it would otherwise be written across
    const said = VIEW_WORDS.timeline(VIEW.incident.hours);
    ctx.font = F(11);
    const room = map(5/SEC_PER_UNIT) - x0 - 10;
    if (ctx.measureText(said.toUpperCase()).width + 0.88*said.length <= room){
      label(said, x0, y+18, 'left', INK3);
    }
  }

  const cols = {};
  for (let i=0;i<tree.nodes.length;i++){
    const n = tree.nodes[i];
    if (!n.reach) continue;
    const px = Math.round(map(n.open));
    const st = cols[px] || 0;
    cols[px] = st + 1;
    const s = states[i];
    ctx.fillStyle = (s==='done') ? ACC : (s==='running') ? ACCHI : (s==='pruned') ? BAD : '#3a3a40';
    ctx.fillRect(px-2, y - 6 - Math.min(st,3)*3, 4, 2);
  }

  const px = map(Math.min(p, tree.total));
  ctx.strokeStyle = ACCHI; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Math.round(px)+0.5, y-18); ctx.lineTo(Math.round(px)+0.5, y+7); ctx.stroke();
  ctx.fillStyle = ACCHI;
  ctx.beginPath();
  ctx.moveTo(px, y-18); ctx.lineTo(px-3.5, y-24); ctx.lineTo(px+3.5, y-24); ctx.closePath(); ctx.fill();
}

function drawGrain(){
  if (!noiseTile || D.grain <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = D.grain * 0.6;
  const ox = -Math.floor(Math.random()*128), oy = -Math.floor(Math.random()*128);
  for (let x=ox; x<W; x+=128) for (let y=oy; y<H; y+=128) ctx.drawImage(noiseTile, x, y);
  ctx.globalAlpha = D.grain * 0.10;
  ctx.fillStyle = '#c9c9c9';
  for (let y=TOP; y<H-BOT; y+=3) ctx.fillRect(0, y, W, 1);
  ctx.restore();
}

/* ---------------------------------------------------------------- pointing */
let camAz = 0.42, camEl = 0.24, drift = 0, dragging = false, lastX = 0, lastY = 0, moved = 0;
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();

function pointerNode(cx, cy){
  if (!gl_ok || !nodeMesh) return -1;
  const r = glc.getBoundingClientRect();
  if (r.width < 1 || r.height < 1) return -1;
  ptr.x = ((cx - r.left)/r.width)*2 - 1;
  ptr.y = -((cy - r.top)/r.height)*2 + 1;
  if (ptr.x < -1 || ptr.x > 1 || ptr.y < -1 || ptr.y > 1) return -1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(nodeMesh, false);
  return (hit && hit.length && hit[0].instanceId !== undefined) ? hit[0].instanceId : -1;
}
function onButton(t){ return !!(t && t.classList && t.classList.contains('btn')); }

stage.addEventListener('pointerdown', e=>{
  if (onButton(e.target)) return;
  stage.focus({preventScroll:true});
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  stage.classList.add('drag');
  if (stage.setPointerCapture){ try { stage.setPointerCapture(e.pointerId); } catch(_){} }
});
stage.addEventListener('pointermove', e=>{
  if (dragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    camAz -= dx*0.006;
    camEl = Math.max(-0.12, Math.min(0.95, camEl + dy*0.004));
    drift = 0;
  } else if (!onButton(e.target)) {
    hover = pointerNode(e.clientX, e.clientY);
    stage.classList.toggle('pick', hover >= 0);
  }
});
stage.addEventListener('pointerup', e=>{
  if (!dragging) return;
  dragging = false; stage.classList.remove('drag');
  if (moved < 5){
    const id = pointerNode(e.clientX, e.clientY);
    if (id >= 0){ sel = id; userPicked = true; }
  }
});
stage.addEventListener('pointercancel', ()=>{ dragging = false; stage.classList.remove('drag'); });
stage.addEventListener('pointerleave', ()=>{ hover = -1; stage.classList.remove('pick'); });

stage.addEventListener('keydown', e=>{
  if (onButton(e.target)) return;
  const n = tree.nodes[sel];
  if (!n) return;
  if (e.key === ' '){ setPlaying(!playing); e.preventDefault(); return; }
  if (e.key === 'ArrowRight'){
    if (n.kids.length){ sel = n.kids[0]; userPicked = true; }
    e.preventDefault(); return;
  }
  if (e.key === 'ArrowLeft'){
    if (n.parent >= 0){ sel = n.parent; userPicked = true; }
    e.preventDefault(); return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    if (n.parent >= 0){
      const sib = tree.nodes[n.parent].kids;
      const i = sib.indexOf(sel);
      const d = (e.key === 'ArrowUp') ? -1 : 1;
      if (i >= 0 && sib.length) sel = sib[(i + d + sib.length) % sib.length];
      userPicked = true;
    }
    e.preventDefault();
  }
});

function setPlaying(v){
  playing = v;
  bPlay.textContent = v ? 'Pause' : 'Play';
  bPlay.setAttribute('data-on', v ? '1' : '0');
  bPlay.setAttribute('aria-pressed', String(!v));
}
bPlay.addEventListener('click', ()=> setPlaying(!playing));
bAgain.addEventListener('click', ()=>{ p = 0; endHold = 0; userPicked = false; sel = 0; setPlaying(true); });
bNew.addEventListener('click', ()=> newRun());
// the story turns between its four sentences and the exact readings behind them, and back
bStory.addEventListener('click', ()=>{
  storyDetails = !storyDetails;
  bStory.setAttribute('data-on', storyDetails ? '1' : '0');
  bStory.setAttribute('aria-pressed', String(storyDetails));
});
// the whole network of the run on screen, in its own page, which creates nothing either
bFull.addEventListener('click', ()=> window.open(fullHref(), '_blank', 'noopener'));

function newRun(){
  seed = (seed*1664525 + 1013904223) >>> 0;
  openBranch = -1; openDecision = -1; grow = 1;
  tree = buildTree(seed);
  states = new Array(tree.nodes.length).fill('');
  scr.length = 0;
  sel = 0; hover = -1; userPicked = false; p = 0; endHold = 0;
  buildScene();
  resolveStates(); paintStates();
  setPlaying(true);
}

/**
 * Show the second accepted campaign, or bring the first one back.
 *
 * The growth run's two files are fetched the first time a reader asks for that run, and kept, so
 * a reader who never asks never waits for them. The page is then rebuilt from whichever campaign
 * is on screen through the same code as before: the same trajectories, the same key, the same
 * band. The run steps back to that campaign's first recorded seed and no decision is left open,
 * so either campaign is read from the top. Nothing is run and nothing is graded.
 */
const setCampaign = async (growth) => {
  if (growth && !GROWTH_RUN){
    bCamp.disabled = true;
    const fetched = await Promise.all(
      GROWTH_FILES.map(one => fetch(one).then(answer => answer.json())));
    GROWTH_RUN = {view: fetched[0], agents: fetched[1]};
    bCamp.disabled = false;
  }
  const held = growth ? GROWTH_RUN : ACCEPTED_RUN;
  showingGrowth = growth;
  VIEW = held.view;
  AGENT_WORK = held.agents;
  readClasses();
  wrapped.clear();
  bCamp.textContent = growth ? VIEW_WORDS.acceptedCampaign : VIEW_WORDS.growthCampaign;
  bCamp.setAttribute('data-on', growth ? '1' : '0');
  seedAt = 0;
  newRun();
};
// the other accepted campaign, and back again. Neither one is fetched until a reader asks for it.
bCamp.addEventListener('click', ()=> setCampaign(!showingGrowth));

/* ------------------------------------------------------------------- dials */
window.setDial = function(name, value){
  const v = Number(value);
  if (!isFinite(v) || !Object.prototype.hasOwnProperty.call(D, name)) return;
  D[name] = v;
  if (name === 'glow'){ if (haloMat) haloMat.uniforms.uGlow.value = v; }
  else if (name === 'edge'){ if (edgeLine) edgeLine.material.opacity = v; }
  else if (name === 'spread'){ if (gl_ok){ placeTree(tree); refreshGeometry(); } }
  else if (name === 'grid') rebuildGrid();
  else if (name === 'dim') paintStates();
  else if (name === 'flow') rebuildFlow();
  else if (name==='soft'||name==='az'||name==='el'||name==='ilev'||name==='warm'||name==='amb'||name==='rim') applyLights();
};

/* -------------------------------------------------------------- frame loop */
let last = 0, clock = 0, histT = 0, raf = 0;

function frame(now){
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, last ? (now-last)/1000 : 0.016);
  last = now; clock += dt;

  if (playing){
    p += dt * 0.42 * D.tempo;
    if (p >= tree.total){
      p = tree.total;
      endHold += dt;
      if (endHold > 1.6){ newRun(); return; }
    }
  }

  let live = 0;
  for (let i=0;i<tree.nodes.length;i++) if (states[i] === 'running') live++;
  const s = signal(clock, dt, live);
  histT += dt;
  if (histT > 0.055){ histT = 0; hist[histN % HIST] = s; histN++; }

  if (resolveStates()) paintStates();

  if (!userPicked){
    let best = -1, bt = -1;
    for (let i=0;i<tree.nodes.length;i++){
      if (states[i] === 'running' && tree.nodes[i].open > bt){ bt = tree.nodes[i].open; best = i; }
    }
    if (best >= 0) sel = best;
  }

  if (gl_ok && nodeMesh){
    if (!dragging) drift += dt;
    const az = camAz + Math.sin(drift*0.13)*0.10;
    const dist = 12.2 * D.depth;
    camera.position.set(
      target.x + dist*Math.sin(az)*Math.cos(camEl),
      target.y + dist*Math.sin(camEl) + 1.1,
      target.z + dist*Math.cos(az)*Math.cos(camEl));
    camera.lookAt(target);

    for (let i=0;i<tree.nodes.length;i++){
      const st = states[i];
      let sc = (st==='pending') ? 0.62 : (st==='skipped') ? 0.5 : (st==='pruned') ? 0.8 : 1;
      if (st === 'running') sc = 1.12 + 0.16*Math.sin(clock*5.2 + i*1.7);
      if (i === sel) sc *= 1.12;
      tmpAx.set(0.3,1,0.2).normalize();
      tmpM.compose(tree.nodes[i].pos, tmpQ.setFromAxisAngle(tmpAx, clock*0.35 + i), tmpS.set(sc,sc,sc));
      nodeMesh.setMatrixAt(i, tmpM);
    }
    nodeMesh.instanceMatrix.needsUpdate = true;

    const hs = haloGeo.getAttribute('aSize'), ha = haloGeo.getAttribute('aAlpha'), hc = haloGeo.getAttribute('aColor');
    for (let i=0;i<tree.nodes.length;i++){
      const st = states[i];
      let size, alpha, cr = 0.09, cg = 0.30, cb = 0.66;
      if (st === 'running'){ size = 1.5 + 0.35*Math.sin(clock*5.2 + i*1.7); alpha = 1; cr=0.30; cg=0.55; cb=0.95; }
      else if (st === 'done'){ size = 0.72; alpha = 0.5; }
      else if (st === 'pruned'){ size = 0.86; alpha = 0.55; cr=0.70; cg=0.09; cb=0.14; }
      else { size = 0.34; alpha = 0.12*(1 - D.dim*0.8); cr=0.16; cg=0.18; cb=0.22; }
      if (i === sel){ size *= 1.35; alpha = Math.max(alpha, 0.6); }
      hs.array[i] = size*0.9; ha.array[i] = alpha;
      hc.array[i*3] = cr; hc.array[i*3+1] = cg; hc.array[i*3+2] = cb;
    }
    hs.needsUpdate = true; ha.needsUpdate = true; hc.needsUpdate = true;

    const fp = flowGeo.getAttribute('position');
    for (let i=0;i<flow.length;i++){
      const f = flow[i];
      f.off += dt * (0.30 + 0.12*(((f.e*7)%5)/5)) * D.tempo;
      if (f.off > 1) f.off -= 1;
      const a = tree.nodes[tree.edges[f.e][0]].pos, b = tree.nodes[tree.edges[f.e][1]].pos;
      ctrlPoint(a,b,tmpV2);
      bez(a,tmpV2,b,f.off,tmpV);
      fp.array[i*3] = tmpV.x; fp.array[i*3+1] = tmpV.y; fp.array[i*3+2] = tmpV.z;
    }
    fp.needsUpdate = true;

    if (ring && tree.nodes[sel]){
      ring.position.copy(tree.nodes[sel].pos);
      ring.lookAt(camera.position);
      ring.rotation.z = clock*0.6;
      ring.material.opacity = Math.max(0, Math.min(1, 0.55 + 0.25*Math.sin(clock*2.4)));
    }

    renderer.render(scene, camera);

    for (let i=0;i<tree.nodes.length;i++){
      tmpProj.copy(tree.nodes[i].pos).project(camera);
      const o = scr[i] || (scr[i] = {x:0,y:0,vis:false});
      o.x = (tmpProj.x*0.5+0.5)*FW;
      o.y = (-tmpProj.y*0.5+0.5)*FH;
      o.vis = (tmpProj.z < 1) && o.x > -40 && o.x < FW+40 && o.y > -40 && o.y < FH+40;
    }
  }

  drawHud(clock);
}

});

if (Array.isArray(window.__dq)){
  for (const q of window.__dq) window.setDial(q[0], q[1]);
  window.__dq.length = 0;
}

raf = requestAnimationFrame(frame);
}
</script>

<script>
/* liveref dials runtime — the canvas drawer drives these values */
(()=>{ const el=document.getElementById('liveref-dials');
  if(!el) return;
  const dials=JSON.parse(el.textContent);
  addEventListener('message', e=>{ const m=e.data||{};
    if (m.liveref==='set') window.setDial?.(m.name, m.value);
    if (m.liveref==='init') for (const k in (m.values||{})) window.setDial?.(k, m.values[k]); });
  parent.postMessage({liveref:'dials', list:dials}, '*');
})();
</script>
