<svg xmlns="http://www.w3.org/2000/svg" width="330" height="330" viewBox="20 32 330 330" role="img" aria-label="検証済み状態からコードが意思決定引継書を組み立てる構造">
<title>引継書はコードが作る／AIが本当に要る場面</title>
<desc>左は決定論的なコードが検証済み状態から引継書を組み立てること、右はAIが本当に必要になる三つの場面と、それが未検証であること。</desc>
<style>
  .t  { font: 14px ui-monospace,"SFMono-Regular","Roboto Mono","Noto Sans JP",sans-serif; fill:#EEF3F5 }
  .ts { font: 12px ui-monospace,"SFMono-Regular","Roboto Mono","Noto Sans JP",sans-serif; fill:#AAB8C0 }
  .th { font: 700 14px ui-monospace,"SFMono-Regular","Roboto Mono","Noto Sans JP",sans-serif; fill:#F5F8F9 }
  .arr  { stroke:#AAB8C0; stroke-width:1.5; fill:none }
  .rule { stroke:#26323A; stroke-width:1 }
  .panel{ fill:none; stroke:#5A6871; stroke-width:1 }
  .c-teal   rect { fill:#08251E; stroke:#62EFA6; stroke-width:1 }
  .c-teal   .th { fill:#8EF2BD } .c-teal   .ts { fill:#62EFA6 }
  .c-purple rect { fill:#081F2A; stroke:#4DE1FF; stroke-width:1 }
  .c-purple .th { fill:#A7F2FF } .c-purple .ts { fill:#4DE1FF }
  .c-amber  rect { fill:#2A210B; stroke:#FFC857; stroke-width:1 }
  .c-amber  .th { fill:#FFE4A2 } .c-amber  .ts { fill:#FFC857 }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AAB8C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="500" fill="#071018"/>

<text x="40" y="28" class="th">④ この一枚は誰が作るのか。そして、AIはどこで要るのか</text>

<rect x="40" y="46" width="290" height="290" rx="8" class="panel"/>
<text x="58" y="72" class="th">作るのは「コード」</text>

<g class="c-teal"><rect x="58" y="88" width="254" height="46" rx="4"/>
<text x="185" y="108" class="th" text-anchor="middle">状態ストア</text>
<text x="185" y="125" class="ts" text-anchor="middle">検証済みの記録</text></g>

<path d="M185,134 L185,154" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="58" y="156" width="254" height="46" rx="4"/>
<text x="185" y="176" class="th" text-anchor="middle">コードが組み立てる</text>
<text x="185" y="193" class="ts" text-anchor="middle">決定論的・毎回同じ手順</text></g>

<path d="M185,202 L185,222" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="58" y="224" width="254" height="46" rx="4"/>
<text x="185" y="244" class="th" text-anchor="middle">引継書</text>
<text x="185" y="261" class="ts" text-anchor="middle">記録からの抜き出しのみ</text></g>

<text x="58" y="294" class="ts">AIは、この一枚を1文字も書いていない。</text>
<text x="58" y="313" class="ts">中身は全て、確認済みの記録から機械的に</text>
<text x="58" y="329" class="ts">取り出したもの。</text>

<rect x="350" y="46" width="290" height="290" rx="8" class="panel" stroke-dasharray="6 4"/>
<text x="368" y="72" class="th">では、AIはどこで要るのか</text>

<g class="c-amber"><rect x="368" y="88" width="254" height="46" rx="4"/>
<text x="380" y="108" class="th">選べる行動が複数あるとき</text>
<text x="380" y="125" class="ts">機械的に一つに決まらない</text></g>

<g class="c-amber"><rect x="368" y="144" width="254" height="46" rx="4"/>
<text x="380" y="164" class="th">新しい証拠で却下すべきとき</text>
<text x="380" y="181" class="ts">「承認」を「却下」へ変える判断</text></g>

<g class="c-amber"><rect x="368" y="200" width="254" height="46" rx="4"/>
<text x="380" y="220" class="th">どの過去の判断が効くか不明</text>
<text x="380" y="237" class="ts">依存関係の発見そのもの</text></g>

<text x="368" y="270" class="ts">いずれも、まだ実験していない。</text>
<text x="368" y="289" class="ts">今回の 8/8 には含まれていない。</text>
<text x="368" y="313" class="ts">今回の一手は、答えが機械的に</text>
<text x="368" y="329" class="ts">一つに決まる場面だった。</text>

<g class="c-teal"><rect x="40" y="356" width="290" height="52" rx="4"/>
<text x="185" y="378" class="th" text-anchor="middle">引継書 ＝ コードの出力</text>
<text x="185" y="396" class="ts" text-anchor="middle">決まった手順・検証可能</text></g>

<g class="c-amber"><rect x="350" y="356" width="290" height="52" rx="4"/>
<text x="495" y="378" class="th" text-anchor="middle">判断 ＝ AIの出力</text>
<text x="495" y="396" class="ts" text-anchor="middle">意味の解釈・確率的</text></g>

<line x1="40" y1="430" x2="640" y2="430" class="rule"/>
<text x="40" y="454" class="th">今回証明したのは、左側だけ。</text>
<text x="40" y="476" class="ts">右側にAIが必要だと示すのは、これからの実験。ここを曖昧にしたまま主張を広げない。</text>
</svg>
