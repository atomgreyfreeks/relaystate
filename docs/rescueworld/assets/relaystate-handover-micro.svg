<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 520 680 360" role="img" aria-label="熊本72時間で生成された意思決定引継書のミクロ構造">
<title>引継書：熊本地震シミュレーションでの位置と中身</title>
<desc>72時間のうちどこの話か、一回ごとに回る輪、そしてその一枚に何が書いてあるか。</desc>
<style>
  .t  { font: 14px ui-monospace,"SFMono-Regular","Roboto Mono","Noto Sans JP",sans-serif; fill:#EEF3F5 }
  .ts { font: 12px ui-monospace,"SFMono-Regular","Roboto Mono","Noto Sans JP",sans-serif; fill:#AAB8C0 }
  .th { font: 700 14px ui-monospace,"SFMono-Regular","Roboto Mono","Noto Sans JP",sans-serif; fill:#F5F8F9 }
  .box  { fill:#0A1118; stroke:#5A6871; stroke-width:1 }
  .arr  { stroke:#AAB8C0; stroke-width:1.5; fill:none }
  .rule { stroke:#26323A; stroke-width:1 }
  .rule2{ stroke:#5A6871; stroke-width:1 }
  .c-gray   rect, .c-gray   circle { fill:#101820; stroke:#6B7982; stroke-width:1 }
  .c-gray   .th { fill:#F0F4F6 } .c-gray   .ts { fill:#AAB8C0 } .c-gray   .t { fill:#EEF3F5 }
  .c-teal   rect, .c-teal   circle { fill:#08251E; stroke:#62EFA6; stroke-width:1 }
  .c-teal   .th { fill:#8EF2BD } .c-teal   .ts { fill:#62EFA6 } .c-teal   .t { fill:#D8FBE8 }
  .c-purple rect, .c-purple circle { fill:#081F2A; stroke:#4DE1FF; stroke-width:1 }
  .c-purple .th { fill:#A7F2FF } .c-purple .ts { fill:#4DE1FF }
  .c-amber  rect, .c-amber  circle { fill:#2A210B; stroke:#FFC857; stroke-width:1 }
  .c-amber  .th { fill:#FFE4A2 } .c-amber  .ts { fill:#FFC857 }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AAB8C0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="880" fill="#071018"/>

<text x="40" y="28" class="th">① 熊本地震の72時間のうち、どこの話か</text>

<line x1="70" y1="92" x2="610" y2="92" class="rule2"/>
<g class="c-gray">
<circle cx="70" cy="92" r="5"/><circle cx="124" cy="92" r="5"/><circle cx="178" cy="92" r="5"/><circle cx="232" cy="92" r="5"/>
<circle cx="394" cy="92" r="5"/><circle cx="448" cy="92" r="5"/><circle cx="502" cy="92" r="5"/><circle cx="556" cy="92" r="5"/><circle cx="610" cy="92" r="5"/>
</g>
<g class="c-amber"><circle cx="286" cy="92" r="8"/><circle cx="340" cy="92" r="8"/></g>

<text x="70" y="76" class="ts" text-anchor="middle">16:27 地震</text>
<text x="610" y="76" class="ts" text-anchor="middle">72時間後</text>
<text x="313" y="60" class="ts" text-anchor="middle">この2つは同じ 20:00</text>
<path d="M286,68 L286,80" class="rule2" fill="none"/>
<path d="M340,68 L340,80" class="rule2" fill="none"/>
<path d="M286,68 L340,68" class="rule2" fill="none"/>

<text x="286" y="116" class="ts" text-anchor="middle">⑤ 部隊を2つの</text>
<text x="286" y="132" class="ts" text-anchor="middle">崩壊現場へ分ける</text>
<text x="393" y="116" class="ts" text-anchor="middle">⑥ 製紙工場の部隊を</text>
<text x="393" y="132" class="ts" text-anchor="middle">確認する</text>

<text x="40" y="176" class="th">② 一回ごとに、この輪が回る</text>
<text x="127" y="206" class="ts" text-anchor="middle">判断⑤</text>
<text x="367" y="206" class="ts" text-anchor="middle">判断⑥</text>

<g class="c-amber"><rect x="40" y="216" width="175" height="44" rx="4"/>
<text x="127" y="235" class="th" text-anchor="middle">判断パケット</text>
<text x="127" y="251" class="ts" text-anchor="middle">AIが見る全て</text></g>
<g class="c-amber"><rect x="280" y="216" width="175" height="44" rx="4"/>
<text x="367" y="235" class="th" text-anchor="middle">判断パケット</text>
<text x="367" y="251" class="ts" text-anchor="middle">AIが見る全て</text></g>

<path d="M127,260 L127,278" class="arr" marker-end="url(#arrow)"/>
<path d="M367,260 L367,278" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="40" y="280" width="175" height="44" rx="4"/>
<text x="127" y="299" class="th" text-anchor="middle">7エージェント</text>
<text x="127" y="315" class="ts" text-anchor="middle">読む・照合・提案</text></g>
<g class="c-gray"><rect x="280" y="280" width="175" height="44" rx="4"/>
<text x="367" y="299" class="th" text-anchor="middle">7エージェント</text>
<text x="367" y="315" class="ts" text-anchor="middle">読む・照合・提案</text></g>

<path d="M127,324 L127,342" class="arr" marker-end="url(#arrow)"/>
<path d="M367,324 L367,342" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="40" y="344" width="175" height="44" rx="4"/>
<text x="127" y="363" class="th" text-anchor="middle">ルール検証</text>
<text x="127" y="379" class="ts" text-anchor="middle">コードが担当</text></g>
<g class="c-purple"><rect x="280" y="344" width="175" height="44" rx="4"/>
<text x="367" y="363" class="th" text-anchor="middle">ルール検証</text>
<text x="367" y="379" class="ts" text-anchor="middle">コードが担当</text></g>

<path d="M127,388 L127,410" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="40" y="412" width="175" height="44" rx="4"/>
<text x="127" y="431" class="th" text-anchor="middle">状態ストア</text>
<text x="127" y="447" class="ts" text-anchor="middle">合格した決定が残る</text></g>

<path d="M127,456 L127,492 L38,492" class="arr" marker-end="url(#arrow)"/>
<text x="240" y="486" class="ts" text-anchor="middle">決定を一枚にして、次の手元へ</text>

<text x="40" y="536" class="th">③ その一枚に、何が書いてあるか</text>

<rect x="40" y="548" width="560" height="252" rx="6" class="box"/>
<g class="c-teal"><rect x="40" y="548" width="560" height="38" rx="6"/>
<text x="60" y="573" class="th">引継書</text>
<text x="580" y="573" class="ts" text-anchor="end">前の判断が作った「宿題」を一枚にしたもの</text></g>

<line x1="40" y1="586" x2="600" y2="586" class="rule2"/>
<text x="60" y="612" class="ts">だれを・どこへ・いくつ</text>
<text x="270" y="612" class="t">宮崎の消防大隊 1つ を、八代の製紙工場へ</text>
<line x1="40" y1="626" x2="600" y2="626" class="rule"/>

<text x="60" y="652" class="ts">使っていい証拠は</text>
<text x="270" y="652" class="t">20:00までに届いていた報告 2件だけ</text>
<line x1="40" y1="666" x2="600" y2="666" class="rule"/>

<text x="60" y="692" class="ts">まだ分からないことは</text>
<text x="270" y="692" class="t">3つ。分からないまま「分からない」と書く</text>
<line x1="40" y1="706" x2="600" y2="706" class="rule"/>

<text x="60" y="732" class="ts">今もこれは有効か</text>
<text x="270" y="732" class="t">前の判断は承認済み。条件も満たしている</text>
<line x1="40" y1="746" x2="600" y2="746" class="rule"/>

<g class="c-amber"><rect x="42" y="748" width="556" height="50" rx="4"/>
<text x="60" y="772" class="ts">返事は必ず</text>
<text x="270" y="772" class="th">「承認する」か「断る」のどちらかを返す</text>
<text x="270" y="789" class="ts">読んで終わりにできない。ここが「まとめ」との違い</text></g>

<path d="M600,567 L620,567 L620,238 L457,238" class="arr" marker-end="url(#arrow)"/>
<text x="642" y="396" class="ts" text-anchor="middle">戻</text>
<text x="642" y="412" class="ts" text-anchor="middle">す</text>

<text x="340" y="838" class="ts" text-anchor="middle">この一枚が届かないと、判断⑥は判断⑤が決めた部隊を選べない。</text>
<text x="340" y="856" class="ts" text-anchor="middle">記録には残っているのに、手元に来ていないから。</text>
</svg>
